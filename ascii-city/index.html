<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ASCII CITY — protótipo 3D</title>
<style>
  /* A interface toda é desenhada dentro da grade de caracteres pelo próprio
     motor do jogo — aqui não existe nenhuma borda, régua ou caixa de CSS.
     Esta folha só cuida de deixar o canvas centrado num fundo preto. */
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;height:100%;width:100%;background:#000;color:#7dffc4;
    font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;overflow:hidden;
  }
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;image-rendering:pixelated;background:#000;cursor:default}
  canvas.playing{cursor:none}
  #err{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
       padding:30px;background:#000;color:#ff7d7d;font-size:14px;white-space:pre-wrap;text-align:center}
</style>
</head>
<body>
<div id="wrap"><canvas id="screen"></canvas></div>
<div id="err"></div>

<script>
"use strict";
/* =====================================================================
   ASCII CITY v2 — jogo 3D desenhado DIRETAMENTE em caracteres.

   Não existe rasterização 3D por baixo: cada frame é um raycaster que
   escreve num buffer de caracteres (um "terminal"), do mesmo jeito que
   os engines de 1992 escreviam em modo texto. Só depois esse buffer de
   glifos é blitado em ImageData. Nenhum WebGL, nenhum triângulo.

     · DDA por coluna sobre uma malha de 1 m gerada sob demanda
     · algoritmo do pintor (longe -> perto) para paredes de altura variável
     · floor casting para o asfalto e as calçadas
     · sprites (postes, árvores) com teste de profundidade por coluna
     · iluminação pontual por célula: postes, outdoors e telões acendem
       de verdade as superfícies em volta

   A cidade é infinita e determinística: nada é armazenado além dos
   quarteirões próximos, e o mesmo seed sempre produz a mesma metrópole.
   ===================================================================== */

/* ------------------------------------------------------------------ */
/* 1. utilidades                                                       */
/* ------------------------------------------------------------------ */

function fail(msg){
  const e = document.getElementById("err");
  e.style.display = "flex"; e.textContent = msg;
  throw new Error(msg);
}
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t) => a + (b-a) * t;
const smooth = t => t*t*(3-2*t);

/** Hash inteiro 3D com boa avalanche — a base de tudo que é procedural.
 *  Sem estado: qualquer coordenada pode ser consultada em O(1), o que é
 *  o que permite a cidade ser infinita nos dois sentidos. */
function hash3(x, y, z){
  let n = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x9e3779b1);
  n ^= n >>> 15; n = Math.imul(n, 0x85ebca6b);
  n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}

/* ------------------------------------------------------------------ */
/* 2. parâmetros do traçado urbano                                     */
/* ------------------------------------------------------------------ */
/*
   O traçado segue como se desenha um plano viário de verdade:

     · a caixa da rua (right-of-way) tem largura FIXA — é o que dá a
       leitura de cidade planejada; o que varia é o tamanho do miolo;
     · os eixos de rua são uma sequência 1-D separável em X e em Z, com
       jitter limitado: eixo(i) = i*MEDIA + ruído. Como o jitter é menor
       que a média, a sequência é monotônica e cada eixo pode ser
       calculado isolado, sem acumular desde a origem — é isso que torna
       a malha infinita e ainda assim perfeitamente alinhada;
     · a calçada é uma faixa de largura fixa medida para dentro do
       quarteirão, então toda esquina fecha certo;
     · o miolo é loteado por subdivisão binária recursiva, e os lotes se
       encostam (paredes geminadas), como num quarteirão real.
*/
const CFG = {
  STREET_W:     12,    // caixa da rua, constante em toda a cidade (par!)
  SIDEWALK_W:   3,     // calçada, medida para dentro do quarteirão
  BLOCK_AVG:    46,    // distância média entre eixos de rua
  BLOCK_JITTER: 18,    // variação do tamanho do quarteirão (< BLOCK_AVG)
  LOT_MIN:      9,     // menor testada de lote
  LOT_MAX:      19,    // acima disso o lote é subdividido
  FLOOR_H:      3.15,  // pé-direito
  FLOORS_MIN:   2,
  FLOORS_MAX:   24,
  LAMP_GAP_MIN: 10,    // vão mínimo entre postes
  LAMP_GAP_MAX: 15,    // vão máximo entre postes
  LAMP_H_MIN:   4.2,   // poste nunca é infinitamente alto
  LAMP_H_MAX:   6.2,
  EYE:          1.70,
  FOG:          105,   // alcance de visão
  LIGHT_R:      17     // raio máximo de uma luz (casa com o bucket)
};
const HALF_ST = CFG.STREET_W / 2;

let WSEED = 1337;

/* eixos de rua: inteiros, para a caixa da rua ficar exata em metros */
function axisX(i){ return Math.round(i * CFG.BLOCK_AVG + (hash3(i, 7717, WSEED) - 0.5) * CFG.BLOCK_JITTER); }
function axisZ(j){ return Math.round(j * CFG.BLOCK_AVG + (hash3(j, 3313, WSEED) - 0.5) * CFG.BLOCK_JITTER); }

function idxX(x){
  let i = Math.floor(x / CFG.BLOCK_AVG);
  while (axisX(i) > x) i--;
  while (axisX(i + 1) <= x) i++;
  return i;
}
function idxZ(z){
  let j = Math.floor(z / CFG.BLOCK_AVG);
  while (axisZ(j) > z) j--;
  while (axisZ(j + 1) <= z) j++;
  return j;
}

/** ruído de valor suave em coordenadas de quarteirão: cria distritos —
 *  um centro adensado, bairros baixos, sem repetição visível. */
function district(i, j){
  const fi = i * 0.085, fj = j * 0.085;
  const i0 = Math.floor(fi), j0 = Math.floor(fj);
  const tx = smooth(fi - i0), tz = smooth(fj - j0);
  const a = hash3(i0,   j0,   WSEED ^ 0x51), b = hash3(i0+1, j0,   WSEED ^ 0x51);
  const c = hash3(i0,   j0+1, WSEED ^ 0x51), d = hash3(i0+1, j0+1, WSEED ^ 0x51);
  return lerp(lerp(a, b, tx), lerp(c, d, tx), tz);
}

/* ------------------------------------------------------------------ */
/* 3. quarteirões                                                      */
/* ------------------------------------------------------------------ */

const NEON = [
  [0.30, 1.00, 0.95], [1.00, 0.24, 0.72], [1.00, 0.72, 0.20],
  [0.55, 0.45, 1.00], [0.35, 0.85, 1.00], [1.00, 0.42, 0.28],
  [0.65, 1.00, 0.35]
];
const ADS = [
  "SUSHI 24H", "NEON BAR", "RAMEN", "CYBER CAFE", "OPEN", "KARAOKE",
  "NOODLES", "HOTEL", "PACHINKO", "TAXI", "DATA CLINIC", "VACANCY",
  "BURGER", "CLUB 88", "PHARMA", "ARCADE", "COFFEE", "TATTOO"
];

/* fonte matricial 5x7 — as letras dos letreiros são desenhadas em blocos,
   como num painel de LED de verdade; de perto dá para ler, de longe vira
   um borrão colorido, exatamente como acontece na rua. */
const FONT57 = (() => {
  const raw = {
    A:"01110100011000111111100011000110001", B:"11110100011000111110100011000111110",
    C:"01110100011000010000100001000101110", D:"11110100011000110001100011000111110",
    E:"11111100001000011110100001000011111", F:"11111100001000011110100001000010000",
    G:"01110100011000010111100011000101111", H:"10001100011000111111100011000110001",
    I:"01110001000010000100001000010001110", J:"00111000100001000010000101001001100",
    K:"10001100101010011000101001001010001", L:"10000100001000010000100001000011111",
    M:"10001110111010110101100011000110001", N:"10001110011010110011100011000110001",
    O:"01110100011000110001100011000101110", P:"11110100011000111110100001000010000",
    Q:"01110100011000110001101011001001101", R:"11110100011000111110101001001010001",
    S:"01111100001000001110000010000111110", T:"11111001000010000100001000010000100",
    U:"10001100011000110001100011000101110", V:"10001100011000110001100010101000100",
    W:"10001100011000110101101011101110001", X:"10001100010101000100010101000110001",
    Y:"10001100010101000100001000010000100", Z:"11111000010001000100010001000011111",
    "0":"01110100011001110101110011000101110", "1":"00100011000010000100001000010001110",
    "2":"01110100010000100010001000100011111", "3":"11111000100010000010000011000101110",
    "4":"00010001100101010010111110001000010", "5":"11111100001111000001000011000101110",
    "6":"00110010001000011110100011000101110", "7":"11111000010001000100010000100001000",
    "8":"01110100011000101110100011000101110", "9":"01110100011000101111000010001001100",
    "-":"00000000000000011111000000000000000", ".":"00000000000000000000000001100001100",
    "!":"00100001000010000100001000000000100", " ":"0".repeat(35)
  };
  const m = new Map();
  for (const k in raw) m.set(k, Uint8Array.from(raw[k], c => c === "1" ? 1 : 0));
  return m;
})();
const FONT_BLANK = FONT57.get(" ");
/* fração de subcélulas acesas de cada letra — é a "densidade de caracteres"
   que vai virar quantidade de luz emitida pelo painel */
const FONT_INK = (() => {
  const m = new Map();
  for (const [k, v] of FONT57){ let n = 0; for (let i = 0; i < 35; i++) n += v[i]; m.set(k, n / 35); }
  return m;
})();

/** subdivisão binária recursiva do miolo do quarteirão em lotes que se
 *  encostam — é assim que um quarteirão real é loteado. */
function splitLots(x0, z0, x1, z1, depth, seed, out){
  const w = x1 - x0, d = z1 - z0;
  if (Math.max(w, d) <= CFG.LOT_MAX || depth >= 6 || out.length >= 40){
    if (w >= 4 && d >= 4) out.push([x0, z0, x1, z1]);
    return;
  }
  const along = w >= d;
  const len = along ? w : d;
  const r = hash3(x0 * 31 + z0, len * 17 + depth, seed);
  let cut = Math.round(len * (0.36 + 0.28 * r));
  if (cut < CFG.LOT_MIN) cut = CFG.LOT_MIN;
  if (len - cut < CFG.LOT_MIN) cut = len - CFG.LOT_MIN;
  if (cut < CFG.LOT_MIN || len - cut < CFG.LOT_MIN){
    if (w >= 4 && d >= 4) out.push([x0, z0, x1, z1]);
    return;
  }
  if (along){
    splitLots(x0, z0, x0 + cut, z1, depth + 1, seed, out);
    splitLots(x0 + cut, z0, x1, z1, depth + 1, seed, out);
  } else {
    splitLots(x0, z0, x1, z0 + cut, depth + 1, seed, out);
    splitLots(x0, z0 + cut, x1, z1, depth + 1, seed, out);
  }
}

/** postes ao longo de uma testada: vão constante dentro da testada e
 *  sorteado dentro de [GAP_MIN, GAP_MAX] — nunca colados, nunca ralos. */
function lampsAlong(out, fixed, a0, a1, horizontal, seed, blk){
  const len = a1 - a0;
  if (len < 4) return;
  const target = CFG.LAMP_GAP_MIN + hash3(seed, 991, WSEED) * (CFG.LAMP_GAP_MAX - CFG.LAMP_GAP_MIN);
  let n = Math.max(1, Math.round(len / target));
  let step = len / n;
  // corrige a contagem até o vão cair de fato dentro da faixa permitida
  while (step > CFG.LAMP_GAP_MAX && n < 16){ n++; step = len / n; }
  while (step < CFG.LAMP_GAP_MIN && n > 1){ n--; step = len / n; }
  const phase = 0.5;                          // meio do intervalo, some das esquinas
  for (let k = 0; k < n; k++){
    const t = a0 + (k + phase) * step;
    const h = CFG.LAMP_H_MIN + hash3(seed + k, 77, WSEED) * (CFG.LAMP_H_MAX - CFG.LAMP_H_MIN);
    const warm = hash3(seed + k, 78, WSEED) < 0.72;
    out.push({
      x: horizontal ? t : fixed,
      z: horizontal ? fixed : t,
      h,
      r: warm ? 1.00 : 0.55, g: warm ? 0.80 : 0.95, b: warm ? 0.48 : 1.00
    });
  }
}

const blockCache = new Map();
const blockOrder = [];

function makeBlock(i, j){
  const x0 = axisX(i) + HALF_ST, x1 = axisX(i + 1) - HALF_ST;
  const z0 = axisZ(j) + HALF_ST, z1 = axisZ(j + 1) - HALF_ST;
  const w = x1 - x0, d = z1 - z0;
  const seed = (Math.imul(i, 73856093) ^ Math.imul(j, 19349663) ^ WSEED) | 0;

  const B = {
    i, j, x0, z0, x1, z1, w, d,
    height: new Uint8Array(w * d),
    lotId:  new Uint8Array(w * d),
    lots: [], lamps: [], bbs: [], lights: [], trees: [],
    park: false
  };

  /* miolo edificável = quarteirão menos a calçada */
  const bx0 = x0 + CFG.SIDEWALK_W, bx1 = x1 - CFG.SIDEWALK_W;
  const bz0 = z0 + CFG.SIDEWALK_W, bz1 = z1 - CFG.SIDEWALK_W;

  const dist = district(i, j);
  B.park = hash3(i, j, WSEED ^ 0xBEEF) < 0.09 || (bx1 - bx0 < 6 || bz1 - bz0 < 6);

  if (!B.park){
    const rects = [];
    splitLots(bx0, bz0, bx1, bz1, 0, seed, rects);

    rects.forEach((r, k) => {
      const [lx0, lz0, lx1, lz1] = r;
      const rh = hash3(lx0 * 7 + k, lz0 * 13, seed);
      // altura: distrito define o patamar, o lote varia em torno dele
      const d2 = clamp((dist - 0.22) / 0.62, 0, 1);
      const base = Math.pow(d2, 1.5);
      let floors = Math.round(lerp(CFG.FLOORS_MIN, CFG.FLOORS_MAX, base * (0.35 + 0.65 * rh)));
      if (hash3(k, 9, seed) < 0.07)                       // torre isolada
        floors = Math.round(floors * (1.9 + 1.5 * hash3(k, 10, seed)) + 6);
      if (hash3(k, 5, seed) < 0.10) floors = Math.max(1, Math.round(floors * 0.22)); // térreo comercial
      floors = clamp(floors, 1, CFG.FLOORS_MAX);
      const h = Math.min(254, Math.round(floors * CFG.FLOOR_H));

      const lot = {
        x0: lx0, z0: lz0, x1: lx1, z1: lz1, h, floors,
        uid: (hash3(lx0, lz0, seed ^ 0x5AF) * 32000) | 0,
        seed: (seed + k * 131) | 0,
        tone: 0.72 + 0.5 * hash3(k, 21, seed)
      };
      B.lots.push(lot);

      const id = B.lots.length;                       // 0 = vazio
      for (let tz = lz0; tz < lz1; tz++){
        const row = (tz - z0) * w;
        for (let tx = lx0; tx < lx1; tx++){
          B.height[row + (tx - x0)] = h;
          B.lotId[row + (tx - x0)]  = id;
        }
      }
      addBillboards(B, lot, bx0, bz0, bx1, bz1);
    });
  } else {
    // praça: bancos e canteiros baixos + arborização
    const n = 3 + Math.floor(hash3(i, j, seed) * 4);
    for (let k = 0; k < n; k++){
      const tw = 2 + Math.floor(hash3(k, 1, seed) * 3);
      const td = 2 + Math.floor(hash3(k, 2, seed) * 3);
      const px = Math.floor(lerp(bx0, bx1 - tw, hash3(k, 3, seed)));
      const pz = Math.floor(lerp(bz0, bz1 - td, hash3(k, 4, seed)));
      const h  = 1 + Math.floor(hash3(k, 5, seed) * 2);
      for (let tz = pz; tz < pz + td; tz++)
        for (let tx = px; tx < px + tw; tx++)
          if (tx >= x0 && tx < x1 && tz >= z0 && tz < z1) B.height[(tz - z0) * w + (tx - x0)] = h;
    }
    const nt = 4 + Math.floor(hash3(i, j, seed ^ 9) * 6);
    for (let k = 0; k < nt; k++){
      B.trees.push({
        x: lerp(bx0 + 1, bx1 - 1, hash3(k, 11, seed)),
        z: lerp(bz0 + 1, bz1 - 1, hash3(k, 12, seed)),
        h: 4.2 + hash3(k, 13, seed) * 3.0,
        seed: (seed + k * 977) & 0x7fff
      });
    }
  }

  /* postes: nas quatro testadas, no eixo da calçada */
  const s = CFG.SIDEWALK_W / 2;
  lampsAlong(B.lamps, z0 + s, x0 + 3, x1 - 3, true,  seed ^ 1, B);
  lampsAlong(B.lamps, z1 - s, x0 + 3, x1 - 3, true,  seed ^ 2, B);
  lampsAlong(B.lamps, x0 + s, z0 + 3, z1 - 3, false, seed ^ 3, B);
  lampsAlong(B.lamps, x1 - s, z0 + 3, z1 - 3, false, seed ^ 4, B);

  /* lista de luzes do quarteirão (consumida pela grade de luzes) */
  for (const L of B.lamps){
    B.lights.push({ x: L.x, y: L.h, z: L.z, r: L.r, g: L.g, b: L.b,
                    rad: 13, inten: 1.15, baseInten: 1.15, lamp: true });
  }
  for (const bb of B.bbs){
    const cx = bb.axis === 0 ? bb.plane + bb.nrm * 1.8 : (bb.u0 + bb.u1) / 2;
    const cz = bb.axis === 0 ? (bb.u0 + bb.u1) / 2 : bb.plane + bb.nrm * 1.8;
    const area = (bb.u1 - bb.u0) * (bb.y1 - bb.y0);
    B.lights.push({
      x: cx, y: (bb.y0 + bb.y1) / 2, z: cz,
      r: bb.r, g: bb.g, b: bb.b,
      rad: clamp(6 + area * 0.22, 8, CFG.LIGHT_R),
      inten: clamp(0.5 + area * 0.02, 0.6, 2.2),
      baseRad: clamp(6 + area * 0.22, 8, CFG.LIGHT_R),
      baseInten: clamp(0.5 + area * 0.02, 0.6, 2.2),
      bb
    });
  }
  return B;
}

/** outdoor/telão numa fachada que dá para a rua. */
function addBillboards(B, lot, bx0, bz0, bx1, bz1){
  if (lot.h < 7) return;
  const faces = [];
  if (lot.x0 === bx0) faces.push({ axis: 0, plane: lot.x0, nrm: -1, a: lot.z0, b: lot.z1 });
  if (lot.x1 === bx1) faces.push({ axis: 0, plane: lot.x1, nrm:  1, a: lot.z0, b: lot.z1 });
  if (lot.z0 === bz0) faces.push({ axis: 1, plane: lot.z0, nrm: -1, a: lot.x0, b: lot.x1 });
  if (lot.z1 === bz1) faces.push({ axis: 1, plane: lot.z1, nrm:  1, a: lot.x0, b: lot.x1 });
  if (!faces.length) return;

  const nBB = hash3(lot.seed, 42, WSEED) < 0.30 ? 2 : (hash3(lot.seed, 43, WSEED) < 0.62 ? 1 : 0);
  for (let k = 0; k < nBB && k < faces.length; k++){
    const f = faces[(k + Math.floor(hash3(lot.seed, 44 + k, WSEED) * faces.length)) % faces.length];
    const span = f.b - f.a;
    if (span < 5) continue;

    const wBB = Math.min(span - 1.5, 7 + hash3(lot.seed, 45 + k, WSEED) * 10);
    const u0 = f.a + (span - wBB) * (0.15 + 0.7 * hash3(lot.seed, 46 + k, WSEED));
    const screen = hash3(lot.seed, 47 + k, WSEED) < 0.40;
    const hBB = screen ? 4.0 + hash3(lot.seed, 48 + k, WSEED) * 5.0
                       : 3.2 + hash3(lot.seed, 49 + k, WSEED) * 2.6;
    const yTop = Math.min(lot.h - 1.0, 5 + hash3(lot.seed, 50 + k, WSEED) * (lot.h - 7));
    const y0 = yTop - hBB;
    if (y0 < 3.2) continue;

    const c = NEON[Math.floor(hash3(lot.seed, 51 + k, WSEED) * NEON.length) % NEON.length];
    B.bbs.push({
      axis: f.axis, plane: f.plane, nrm: f.nrm,
      u0, u1: u0 + wBB, y0, y1: yTop,
      screen,
      r: c[0], g: c[1], b: c[2],
      text: ADS[Math.floor(hash3(lot.seed, 52 + k, WSEED) * ADS.length) % ADS.length],
      phase: hash3(lot.seed, 53 + k, WSEED) * 10,
      speed: 0.6 + hash3(lot.seed, 54 + k, WSEED) * 1.6
    });
  }
}

function getBlock(i, j){
  const key = i + "," + j;
  let B = blockCache.get(key);
  if (B) return B;
  B = makeBlock(i, j);
  blockCache.set(key, B);
  blockOrder.push(key);
  if (blockOrder.length > 220){                  // descarta os mais antigos
    for (let k = 0; k < 40; k++) blockCache.delete(blockOrder.shift());
  }
  return B;
}
function resetCity(){ blockCache.clear(); blockOrder.length = 0; memoReset(); }

/* Consultas de mundo. O memo guarda a CÉLULA DA MALHA inteira — do eixo
   de rua i ao eixo i+1 — e não só o quarteirão: assim os dezenas de
   passos que o raio dá dentro da rua também acertam o cache. */
let mAX0 = 1, mAX1 = 0, mAZ0 = 1, mAZ1 = 0, mBlk = null;
function memoReset(){ mAX0 = 1; mAX1 = 0; mAZ0 = 1; mAZ1 = 0; mBlk = null; }

function cellFor(tx, tz){
  if (tx < mAX0 || tx >= mAX1 || tz < mAZ0 || tz >= mAZ1){
    const i = idxX(tx), j = idxZ(tz);
    mAX0 = axisX(i); mAX1 = axisX(i + 1);
    mAZ0 = axisZ(j); mAZ1 = axisZ(j + 1);
    mBlk = getBlock(i, j);
  }
  return mBlk;
}
function blockAtTile(tx, tz){
  const B = cellFor(tx, tz);
  return (tx >= B.x0 && tx < B.x1 && tz >= B.z0 && tz < B.z1) ? B : null;
}
function heightAtTile(tx, tz){
  const B = cellFor(tx, tz);
  if (tx < B.x0 || tx >= B.x1 || tz < B.z0 || tz >= B.z1) return 0;   // rua
  return B.height[(tz - B.z0) * B.w + (tx - B.x0)];
}

/* ------------------------------------------------------------------ */
/* 4. grade de luzes + sombreamento                                    */
/* ------------------------------------------------------------------ */
/*  Cada poste, outdoor e telão é uma luz pontual de verdade. Para não
    testar todas contra cada célula, elas entram numa grade uniforme com
    célula do tamanho do raio máximo: aí basta varrer os 3x3 buckets em
    volta do ponto para ter todas as luzes que podem alcançá-lo.        */

const LG_N = 24, LG_S = CFG.LIGHT_R;
const lgBuckets = new Array(LG_N * LG_N);
for (let k = 0; k < lgBuckets.length; k++) lgBuckets[k] = [];
let lgOx = 0, lgOz = 0, lgKey = "";
const signLights = [];        // só as luzes de painel, para o pulso por frame
const lampLights = [];        // postes: apagam quando amanhece

function rebuildLights(px, pz){
  const bi = idxX(px), bj = idxZ(pz);
  const key = bi + "," + bj;
  if (key === lgKey) return;
  lgKey = key;

  lgOx = Math.floor(px / LG_S) - (LG_N >> 1);
  lgOz = Math.floor(pz / LG_S) - (LG_N >> 1);
  for (let k = 0; k < lgBuckets.length; k++) lgBuckets[k].length = 0;
  signLights.length = 0;
  lampLights.length = 0;

  for (let dj = -3; dj <= 3; dj++){
    for (let di = -3; di <= 3; di++){
      const B = getBlock(bi + di, bj + dj);
      for (let n = 0; n < B.lights.length; n++){
        const L = B.lights[n];
        const cx = Math.floor(L.x / LG_S) - lgOx;
        const cz = Math.floor(L.z / LG_S) - lgOz;
        if (cx < 0 || cz < 0 || cx >= LG_N || cz >= LG_N) continue;
        lgBuckets[cz * LG_N + cx].push(L);
        if (L.bb) signLights.push(L);
        else if (L.lamp) lampLights.push(L);
      }
    }
  }
}

let sR = 0, sG = 0, sB = 0;
let lightsOn = true;

function shade(px, py, pz, nx, ny, nz){
  const up = 0.5 + 0.5 * ny;
  sR = ENV.amb[0] * up + ENV.bou[0] * (1 - up);
  sG = ENV.amb[1] * up + ENV.bou[1] * (1 - up);
  sB = ENV.amb[2] * up + ENV.bou[2] * (1 - up);
  const kd = nx * ENV.dir[0] + ny * ENV.dir[1] + nz * ENV.dir[2];
  if (kd > 0){ sR += ENV.key[0] * kd; sG += ENV.key[1] * kd; sB += ENV.key[2] * kd; }
  if (!lightsOn) return;

  const cx = Math.floor(px / LG_S) - lgOx;
  const cz = Math.floor(pz / LG_S) - lgOz;
  if (cx < 1 || cz < 1 || cx >= LG_N - 1 || cz >= LG_N - 1) return;

  for (let jz = cz - 1; jz <= cz + 1; jz++){
    for (let jx = cx - 1; jx <= cx + 1; jx++){
      const arr = lgBuckets[jz * LG_N + jx];
      for (let n = 0; n < arr.length; n++){
        const L = arr[n];
        const dx = L.x - px, dy = L.y - py, dz = L.z - pz;
        const d2 = dx*dx + dy*dy + dz*dz;
        const rad = L.rad;
        if (d2 >= rad * rad) continue;
        const d = Math.sqrt(d2) + 1e-4;
        const ndl = (dx*nx + dy*ny + dz*nz) / d;
        if (ndl <= 0) continue;
        const t = 1 - d / rad;
        const k = t * t * L.inten * ndl;
        sR += L.r * k; sG += L.g * k; sB += L.b * k;
      }
    }
  }
}

/* ------------------------------------------------------------------ */
/* 4b. ambiente: ciclo do dia e clima                                  */
/* ------------------------------------------------------------------ */
/*  Um ciclo completo leva 10 minutos. Tudo que descreve o ambiente vem
    de quadros-chave interpolados: cor do céu, luz principal e sua
    direção, ambiente, névoa, quanto de estrela aparece, quanto o neon
    está aceso e a "íris" da exposição — sem ela o dia estoura a rampa
    de caracteres inteira, já que a mesma cena fica ~40x mais clara.    */

const CYCLE_S = 600;
let dayStart = 0.72;                    // começa de noite, cara do projeto

/* t, céu(zênite), céu(horizonte), ambiente, rebote, luz-chave, elevação,
   névoa, estrelas, neon, íris, nome                                    */
const DAY_KEYS = [

  { t:0.18, zen:[0.150,0.290,0.610], hor:[0.520,0.630,0.840], amb:[0.620,0.700,0.880],
    bou:[0.100,0.090,0.075], key:[1.050,0.980,0.860], el:0.50, fog:[0.330,0.400,0.520],
