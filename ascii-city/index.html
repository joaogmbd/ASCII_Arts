  { t:0.56, zen:[0.095,0.150,0.400], hor:[0.940,0.500,0.230], amb:[0.235,0.210,0.265],
    bou:[0.140,0.080,0.040], key:[1.200,0.640,0.300], el:0.11, fog:[0.310,0.190,0.150],
    star:0.0, neon:0.45, exp:0.90, name:"por do sol" },
  { t:0.66, zen:[0.035,0.045,0.120], hor:[0.400,0.170,0.330], amb:[0.090,0.088,0.155],
    bou:[0.110,0.055,0.040], key:[0.330,0.190,0.290], el:0.02, fog:[0.090,0.050,0.085],
    star:0.55, neon:0.90, exp:0.96, name:"anoitecer" },
  { t:0.78, zen:[0.007,0.010,0.024], hor:[0.048,0.034,0.078], amb:[0.030,0.038,0.068],
    bou:[0.058,0.032,0.018], key:[0.085,0.098,0.140], el:0.62, fog:[0.016,0.016,0.030],
    star:1.0, neon:1.00, exp:1.00, name:"noite" },
  { t:1.00, zen:[0.007,0.010,0.024], hor:[0.048,0.034,0.078], amb:[0.030,0.038,0.068],
    bou:[0.058,0.032,0.018], key:[0.085,0.098,0.140], el:0.62, fog:[0.016,0.016,0.030],
    star:1.0, neon:1.00, exp:1.00, name:"noite" }
];

const WEATHERS = ["limpo", "chuva", "neve", "tempestade"];
const WEATHER_S = 95;                   // cada trecho de clima

const ENV = {
  t: 0, name: "noite",
  zen: [0,0,0], hor: [0,0,0], amb: [0,0,0], bou: [0,0,0],
  key: [0,0,0], dir: [0,1,0], fog: [0,0,0],
  star: 1, neon: 1, exp: 1,
  weather: "limpo", wet: 0, fall: 0, snowy: 0, flash: 0, gust: 0
};

function mix3(o, a, b, k){ o[0]=a[0]+(b[0]-a[0])*k; o[1]=a[1]+(b[1]-a[1])*k; o[2]=a[2]+(b[2]-a[2])*k; }

/** clima determinístico por trecho de tempo, com transição suave */
function weatherAt(slot){
  const r = hash3(slot, 4711, WSEED);
  return r < 0.50 ? "limpo" : (r < 0.76 ? "chuva" : (r < 0.88 ? "neve" : "tempestade"));
}

function updateEnv(){
  const t = ENV.t = (dayStart + TIME / CYCLE_S) % 1;
  let i = 0;
  while (i < DAY_KEYS.length - 2 && DAY_KEYS[i + 1].t <= t) i++;
  const a = DAY_KEYS[i], b = DAY_KEYS[i + 1];
  const k = smooth(clamp((t - a.t) / Math.max(1e-4, b.t - a.t), 0, 1));
  mix3(ENV.zen, a.zen, b.zen, k); mix3(ENV.hor, a.hor, b.hor, k);
  mix3(ENV.amb, a.amb, b.amb, k);   mix3(ENV.bou, a.bou, b.bou, k);
  mix3(ENV.key, a.key, b.key, k);   mix3(ENV.fog, a.fog, b.fog, k);
  ENV.star = lerp(a.star, b.star, k);
  ENV.neon = lerp(a.neon, b.neon, k);
  ENV.exp  = lerp(a.exp,  b.exp,  k);
  ENV.name = k < 0.5 ? a.name : b.name;

  // sol/lua percorrendo o céu
  const el = lerp(a.el, b.el, k);
  const az = (t - 0.20) * Math.PI * 2;
  const ce = Math.cos(el * Math.PI * 0.5), se = Math.sin(el * Math.PI * 0.5);
  ENV.dir[0] = ce * Math.sin(az); ENV.dir[1] = Math.max(0.03, se); ENV.dir[2] = ce * Math.cos(az);
  const L = Math.hypot(ENV.dir[0], ENV.dir[1], ENV.dir[2]);
  ENV.dir[0] /= L; ENV.dir[1] /= L; ENV.dir[2] /= L;

  /* --- clima --- */
  const slot = Math.floor(TIME / WEATHER_S);
  const inSlot = (TIME % WEATHER_S) / WEATHER_S;
  const cur = weatherAt(slot), nxt = weatherAt(slot + 1);
  ENV.weather = inSlot > 0.94 ? nxt : cur;
  const ramp = inSlot < 0.06 ? inSlot / 0.06 : (inSlot > 0.94 ? (1 - inSlot) / 0.06 : 1);
  const w = ENV.weather;
  const rain  = (w === "chuva" ? 0.55 : (w === "tempestade" ? 1.0 : 0)) * ramp;
  const snow  = (w === "neve" ? 1.0 : 0) * ramp;
  ENV.fall  = rain + snow;
  ENV.snowy = snow > 0.02 ? 1 : 0;
  ENV.wet   = rain;
  ENV.gust  = (w === "tempestade" ? 1 : (w === "neve" ? 0.35 : 0.15)) * ramp;

  // relâmpago: clarão curto e raro
  ENV.flash = 0;
  if (w === "tempestade" && ramp > 0.5){
    const s = Math.floor(TIME / 7);
    const at = hash3(s, 99, WSEED) * 7;
    const d = (TIME % 7) - at;
    if (d > 0 && d < 0.22) ENV.flash = Math.pow(1 - d / 0.22, 2) * (0.5 + 0.5 * hash3(s, 7, WSEED));
  }

  // céu encoberto engole a cor e as estrelas
  const cover = clamp(rain * 1.3 + snow * 0.9, 0, 1);
  if (cover > 0){
    const gz = [0.030 + 0.02 * snow, 0.034 + 0.024 * snow, 0.046 + 0.034 * snow];
    const gh = [0.075 + 0.05 * snow, 0.082 + 0.055 * snow, 0.105 + 0.06 * snow];
    const day = 1 - ENV.star;                        // de dia o encoberto é claro
    for (let c = 0; c < 3; c++){
      const zc = gz[c] * (1 + day * 6), hc = gh[c] * (1 + day * 5);
      ENV.zen[c] = lerp(ENV.zen[c], zc, cover * 0.85);
      ENV.hor[c] = lerp(ENV.hor[c], hc, cover * 0.85);
      ENV.amb[c] = lerp(ENV.amb[c], ENV.amb[c] * 0.75 + 0.012, cover * 0.7);
      ENV.key[c] *= 1 - 0.55 * cover;
      ENV.fog[c] = lerp(ENV.fog[c], ENV.fog[c] * 1.4 + 0.010, cover * 0.8);
    }
    ENV.star *= 1 - cover;
  }
  if (ENV.flash > 0){
    for (let c = 0; c < 3; c++){
      ENV.amb[c] += ENV.flash * 0.42;
      ENV.zen[c] += ENV.flash * 0.30;
      ENV.hor[c] += ENV.flash * 0.30;
    }
  }
}

/* ---- partículas de chuva e neve ------------------------------------ */
/*  Ficam num cilindro em volta do jogador, em coordenada de mundo: caem,
    são projetadas como qualquer sprite e passam pelo z-buffer. Com isso
    ganham paralaxe e perspectiva de graça — e a densidade é baixa de
    propósito, para molhar a cena sem sujar a leitura do texto.         */
const DROPS = 900;
const dropX = new Float32Array(DROPS), dropY = new Float32Array(DROPS), dropZ = new Float32Array(DROPS);
const dropV = new Float32Array(DROPS);
let dropsReady = false;
const DROP_R = 14, DROP_H = 7.5;

function seedDrop(i, aroundY){
  const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * DROP_R;
  dropX[i] = cam.x + Math.cos(a) * r;
  dropZ[i] = cam.z + Math.sin(a) * r;
  dropY[i] = aroundY === undefined ? Math.random() * DROP_H : DROP_H;
  dropV[i] = 0.75 + Math.random() * 0.5;
}
function updateDrops(dt){
  if (!dropsReady){ for (let i = 0; i < DROPS; i++) seedDrop(i); dropsReady = true; }
  const snow = ENV.snowy;
  const fall = (snow ? 1.5 : 15.0) * dt;
  const drift = (snow ? 0.9 : 0.25) * ENV.gust;
  for (let i = 0; i < DROPS; i++){
    dropY[i] -= fall * dropV[i];
    if (snow){
      dropX[i] += Math.sin(TIME * 0.9 + i) * drift * dt * 3;
      dropZ[i] += Math.cos(TIME * 0.7 + i * 1.7) * drift * dt * 3;
    } else {
      dropX[i] += drift * dt * 6;
    }
    const dx = dropX[i] - cam.x, dz = dropZ[i] - cam.z;
    if (dropY[i] < 0 || dx*dx + dz*dz > DROP_R * DROP_R) seedDrop(i, 1);
  }
}

let RAIN_GLYPHS = null, SNOW_GLYPHS = null;
function initWeatherGlyphs(){
  RAIN_GLYPHS = [ci("'"), ci("|"), ci(":"), ci("!")];
  SNOW_GLYPHS = [ci("*"), ci("."), ci("+"), ci("o")];
}

function drawWeather(){
  if (ENV.fall < 0.02) return;
  const snow = ENV.snowy;
  const n = Math.round(DROPS * clamp(ENV.fall, 0, 1) * (snow ? 0.85 : 1));
  // paleta fria e discreta; na tempestade o clarão acende a chuva
  const base = snow ? [0.70, 0.74, 0.92] : [0.38, 0.58, 0.80];
  const boost = 1 + ENV.flash * 3.2;
  const gl = snow ? SNOW_GLYPHS : RAIN_GLYPHS;
  for (let i = 0; i < n; i++){
    const dx = dropX[i] - cam.x, dz = dropZ[i] - cam.z;
    const t = dx * dirX + dz * dirZ;
    if (t < 0.6 || t > DROP_R) continue;
    const sx = dx * rgtX + dz * rgtZ;
    const cx = Math.round(COLS / 2 + (sx / t / tanH) * (COLS / 2));
    if (cx < 0 || cx >= COLS || t >= zbuf[cx]) continue;
    const yy = horizon - (dropY[i] - cam.eye) * projV / t;
    const len = snow ? 0 : clamp(Math.round(0.24 * projV / t * dropV[i]), 0, 4);
    const near = clamp(1 - t / DROP_R, 0, 1);
    const k = (0.42 + 0.58 * near) * boost * clamp(0.55 + 0.45 * ENV.fall, 0, 1);
    const g = gl[(i + (snow ? 0 : (t * 3) | 0)) & 3];
    for (let s = 0; s <= len; s++){
      const y = Math.round(yy) - s;
      if (y < 0 || y >= ROWS) continue;
      const idx = y * COLS + cx;
      const f = k * (1 - s / (len + 1) * 0.5);
      cellChar[idx] = g;
      const r = base[0] * f * 255, gg = base[1] * f * 255, b = base[2] * f * 255;
      cellCol[idx] = (r > 255 ? 255 : r | 0) << 16 | (gg > 255 ? 255 : gg | 0) << 8 | (b > 255 ? 255 : b | 0);
    }
  }
}

/* ------------------------------------------------------------------ */
/* 5. terminal: atlas de glifos e blit em ImageData                    */
/* ------------------------------------------------------------------ */
/*  O buffer de saída é literalmente uma grade de caracteres. O atlas
    guarda a máscara de cada glifo quantizada em 3 níveis; desenhar uma
    célula é percorrer só os pixels acesos do glifo e escrever a cor da
    célula já pré-multiplicada. Sem GPU, sem fillText por célula.      */

const ATLAS_CHARS =
  " !\"#$%&'()*+,-./0123456789:;<=>?@" +
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`" +
  "abcdefghijklmnopqrstuvwxyz{|}~" +
  "░▒▓█";
const CHAR_IDX = new Map();
for (let k = 0; k < ATLAS_CHARS.length; k++) CHAR_IDX.set(ATLAS_CHARS[k], k);
const ci = ch => CHAR_IDX.get(ch) || 0;

const CHARSETS = [
  { name: "classic", ramp: " .:-=+*#%@" },
  { name: "dense",   ramp: " .,:;i1tfLCG08@" },
  { name: "minimal", ramp: " .:*oO0@" },
  { name: "blocks",  ramp: " .░▒▓█" }
];
let RAMP = null;                 // Uint8Array com os índices do atlas
function setCharset(k){
  RAMP = Uint8Array.from(Array.from(CHARSETS[k].ramp), c => ci(c));
}

const CELL_SIZES = [[6,10],[7,12],[8,14],[10,17],[12,21],[14,25]];
let cellW = 8, cellH = 14;

let glyphOff = [], glyphLv = [];  // por glifo: offsets no framebuffer + nível

function buildGlyphs(W){
  const c = document.createElement("canvas");
  c.width = cellW; c.height = cellH;
  const g = c.getContext("2d", { willReadFrequently: true });
  glyphOff = new Array(ATLAS_CHARS.length);
  glyphLv  = new Array(ATLAS_CHARS.length);

  for (let k = 0; k < ATLAS_CHARS.length; k++){
    g.clearRect(0, 0, cellW, cellH);
    g.fillStyle = "#fff";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = `${Math.round(cellH * 0.80)}px "DejaVu Sans Mono","Menlo","Consolas","Courier New",monospace`;
    g.fillText(ATLAS_CHARS[k], cellW / 2, cellH / 2 + cellH * 0.06);
    const px = g.getImageData(0, 0, cellW, cellH).data;
    const off = [], lv = [];
    for (let y = 0; y < cellH; y++){
      for (let x = 0; x < cellW; x++){
        const a = px[(y * cellW + x) * 4 + 3];
        if (a < 26) continue;
        off.push(y * W + x);
        lv.push(a < 110 ? 1 : (a < 200 ? 2 : 3));
      }
    }
    glyphOff[k] = Int32Array.from(off);
    glyphLv[k]  = Uint8Array.from(lv);
  }
}

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", { alpha: false });
if (!ctx) fail("Não foi possível abrir o canvas 2D.");

let COLS = 0, ROWS = 0, SW = 0, SH = 0;
let cellChar = null, cellCol = null, cellDep = null, cellId = null;
let imgData = null, imgU32 = null;
const BG = 0xff05070a;            // ABGR
const lut = new Uint32Array(4);

function blit(){
  imgU32.fill(BG);
  for (let cy = 0; cy < ROWS; cy++){
    const rowBase = cy * cellH * SW;
    const line = cy * COLS;
    for (let cx = 0; cx < COLS; cx++){
      const g = cellChar[line + cx];
      if (g === 0) continue;
      const col = cellCol[line + cx];
      const r = (col >> 16) & 255, gg = (col >> 8) & 255, b = col & 255;
      lut[1] = 0xff000000 | ((b / 3) << 16) | ((gg / 3) << 8) | (r / 3);
      lut[2] = 0xff000000 | (((b * 2 / 3) | 0) << 16) | (((gg * 2 / 3) | 0) << 8) | ((r * 2 / 3) | 0);
      lut[3] = 0xff000000 | (b << 16) | (gg << 8) | r;
      const O = glyphOff[g], L = glyphLv[g];
      const base = rowBase + cx * cellW;
      for (let k = 0; k < O.length; k++) imgU32[base + O[k]] = lut[L[k]];
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

/* ------------------------------------------------------------------ */
/* 6. raycaster                                                        */
/* ------------------------------------------------------------------ */

const cam = { x: 0, z: 0, yaw: 0, pitch: 0, eye: CFG.EYE };
const TUNE = { exposure: 6.2, gamma: 0.82, black: 0.014, fov: 74 * Math.PI / 180 };
let colorMode = true;
let TIME = 0;

let projH = 0, projV = 0, horizon = 0, tanH = 0;
let dirX = 0, dirZ = 0, rgtX = 0, rgtZ = 0;
let zbuf = null, rdxs = null, rdzs = null;

/* pilha de paredes de uma coluna (evita alocar por frame) */
const MAXHIT = 24;
const hDist = new Float64Array(MAXHIT);
const hHigh = new Float64Array(MAXHIT);
const hSide = new Uint8Array(MAXHIT);
const hMapX = new Int32Array(MAXHIT);
const hMapZ = new Int32Array(MAXHIT);

/** luminância -> glifo + cor (o coração do "de fato ASCII") */
function emit(idx, r, g, b){
  let lum = 0.2126 * r + 0.7152 * g + 0.0722 * b - TUNE.black;
  if (lum <= 0){ cellChar[idx] = 0; return; }
  let t = 1 - Math.exp(-lum * TUNE.exposure * ENV.exp);
  t = Math.pow(t, TUNE.gamma);
  let ri = (t * RAMP.length) | 0;
  if (ri >= RAMP.length) ri = RAMP.length - 1;
  cellChar[idx] = RAMP[ri];
  if (RAMP[ri] === 0) return;

  if (colorMode){
    const m = Math.max(r, Math.max(g, b)) || 1e-6;
    const s = (0.40 + 0.60 * t) * 255 / m;
    const R = r * s, G = g * s, B = b * s;
    cellCol[idx] = ((R > 255 ? 255 : R) | 0) << 16 | ((G > 255 ? 255 : G) | 0) << 8 | ((B > 255 ? 255 : B) | 0);
  } else {
    const v = 0.30 + 0.70 * t;
    cellCol[idx] = ((125 * v) | 0) << 16 | ((255 * v) | 0) << 8 | ((196 * v) | 0);
  }
}
function emitChar(idx, glyph, r, g, b){
  cellChar[idx] = glyph;
  if (colorMode){
    const m = Math.max(r, Math.max(g, b)) || 1e-6;
    const s = 255 / m;
    cellCol[idx] = ((r * s) | 0) << 16 | ((g * s) | 0) << 8 | ((b * s) | 0);
  } else {
    cellCol[idx] = 0x7dffc4;
  }
}

/* ---- céu -------------------------------------------------------- */
function skyColumn(cx, topRow, ang, hx, hz){
  const sunI = 2.6 * (1 - ENV.star * 0.72);
  const km = Math.max(ENV.key[0], Math.max(ENV.key[1], ENV.key[2])) || 1;
  for (let y = 0; y < topRow; y++){
    const elev = (horizon - y - 0.5) / projV;          // tangente da elevação
    const glow = Math.exp(-Math.abs(elev) * 2.6);
    let r = ENV.zen[0] + (ENV.hor[0] - ENV.zen[0]) * glow;
    let g = ENV.zen[1] + (ENV.hor[1] - ENV.zen[1]) * glow;
    let b = ENV.zen[2] + (ENV.hor[2] - ENV.zen[2]) * glow;

    // sol ou lua, percorrendo o céu junto com a luz-chave
    const inv = 1 / Math.sqrt(1 + elev * elev);
    const dot = (hx * ENV.dir[0] + elev * ENV.dir[1] + hz * ENV.dir[2]) * inv;
    if (dot > 0.9955){
      const core = dot > 0.9988 ? 1 : (dot - 0.9955) / 0.0033 * 0.35;
      r += ENV.key[0] / km * sunI * core;
      g += ENV.key[1] / km * sunI * core;
      b += ENV.key[2] / km * sunI * core;
    }
    if (ENV.star > 0.02 && elev > 0.05){
      const st = hash3((ang * 58) | 0, (elev * 46) | 0, 7);
      if (st > 0.9955){
        const tw = 0.6 + 0.4 * Math.sin(TIME * 2.1 + st * 400);
        const a = ENV.star * tw;
        r += 0.30 * a; g += 0.38 * a; b += 0.46 * a;
      }
    }
    emit(y * COLS + cx, r, g, b);
  }
}

/* ---- material do piso ------------------------------------------- */
function groundColor(wx, wz, out){
  const tx = Math.floor(wx), tz = Math.floor(wz);
  const B = blockAtTile(tx, tz);
  if (B){
    const inner = wx > B.x0 + CFG.SIDEWALK_W && wx < B.x1 - CFG.SIDEWALK_W &&
                  wz > B.z0 + CFG.SIDEWALK_W && wz < B.z1 - CFG.SIDEWALK_W;
    // calçada: placas de 2 m com junta escura
    const jx = Math.abs((wx * 0.5) % 1 - 0.5), jz = Math.abs((wz * 0.5) % 1 - 0.5);
    const joint = (jx > 0.46 || jz > 0.46) ? 0.45 : 1.0;
    const base = inner ? 0.20 : 0.30;                  // miolo de praça x calçada
    out[0] = base * joint; out[1] = base * joint * 1.02; out[2] = base * joint * 1.12;
    return;
  }
  // asfalto + faixa central tracejada no eixo da rua
  const cxs = (wx - mAX0) < (mAX1 - wx) ? mAX0 : mAX1;
  const czs = (wz - mAZ0) < (mAZ1 - wz) ? mAZ0 : mAZ1;
  const dxs = Math.abs(wx - cxs), dzs = Math.abs(wz - czs);
  let mark = 0;
  if (dxs < HALF_ST && Math.abs(wx - cxs) < 0.16 && ((wz * 0.22) % 1) < 0.5) mark = 1;
  if (dzs < HALF_ST && Math.abs(wz - czs) < 0.16 && ((wx * 0.22) % 1) < 0.5) mark = 1;
  const a = 0.115 + mark * 0.85;
  out[0] = a; out[1] = a * 0.99; out[2] = a * 0.95;
}
const gcol = [0, 0, 0];

/* ---- fachada ------------------------------------------------------ */
function facade(u, wy, lot, out){
  const tone = lot ? lot.tone : 1;
  const ao = 0.42 + 0.58 * Math.min(1, wy / 9);
  let a = 0.215 * tone * ao;
  out[0] = a; out[1] = a * 1.02; out[2] = a * 1.16;
  out[3] = out[4] = out[5] = 0;                         // emissivo

  if (!lot) return;
  const cw = 2.35, ch = CFG.FLOOR_H;
  const wc = Math.floor(u / cw), wr = Math.floor(wy / ch);
  const fu = u / cw - wc, fv = wy / ch - wr;
  if (fu < 0.17 || fu > 0.83 || fv < 0.24 || fv > 0.82) return;
  const h = hash3(wc, wr, lot.seed);
  if (h < 0.42 + 0.45 * (1 - ENV.neon)) return;          // de dia quase nenhuma acesa
  if (hash3(wc, wr + ((TIME * 0.5) | 0), lot.seed ^ 99) > 0.992) return;   // pisca
  const warm = h < 0.80;
  const k = (0.55 + 0.75 * hash3(wc, wr, lot.seed ^ 7)) * (0.25 + 0.75 * ENV.neon);
  if (warm){ out[3] = 1.00 * k; out[4] = 0.80 * k; out[5] = 0.48 * k; }
  else {
    const c = NEON[Math.floor(h * 997) % NEON.length];
    out[3] = c[0] * k; out[4] = c[1] * k; out[5] = c[2] * k;
  }
}
const fcol = [0, 0, 0, 0, 0, 0];

/* ---- conteúdo de outdoor / telão ---------------------------------- */
const LETTER_W = 1.15, LETTER_H = 1.70;      // tamanho de uma letra no mundo

/* brilho de cada parte do painel — usado tanto para desenhar quanto para
   medir a luz que ele joga na rua, para os dois nunca saírem de sincronia */
const EM_FRAME = 2.2, EM_LETTER = 3.1, EM_BAR = 2.8, EM_OFF = 0.10;

/** altura da barra c do equalizador, em [0,1]. A batida é global, então a
 *  tela toda acende e apaga junta e a fachada pulsa no ritmo. */
function screenBar(bb, c, t){
  const beat = 0.26 + 0.74 * Math.pow(0.5 + 0.5 * Math.sin(t * 1.25 + bb.phase * 2), 1.7);
  const v = 0.42 + 0.58 * Math.sin(t * 2.1 + c * 0.85) * Math.sin(t * 0.73 + c * 0.37);
  const l = beat * v;
  return l < 0 ? 0 : (l > 1 ? 1 : l);
}
function framePulse(bb){ return 0.75 + 0.25 * Math.sin(TIME * 3 + bb.phase); }

function billboardCell(bb, u, wy, out){
  const w = bb.u1 - bb.u0, h = bb.y1 - bb.y0;
  const ul = bb.nrm > 0 ? (u - bb.u0) : (bb.u1 - u);   // texto sempre legível de fora
  const vl = bb.y1 - wy;

  // moldura acesa
  if (ul < 0.35 || ul > w - 0.35 || vl < 0.30 || vl > h - 0.30){
    const p = framePulse(bb);
    out[0] = bb.r * EM_FRAME * p; out[1] = bb.g * EM_FRAME * p; out[2] = bb.b * EM_FRAME * p;
    return ci("█");
  }

  if (bb.screen){
    // telão: equalizador animado
    const cw = 0.62, chh = 0.62;
    const cxp = Math.floor(ul / cw), cyp = Math.floor(vl / chh);
    const nrows = Math.max(1, Math.floor((h - 0.6) / chh));
    const level = screenBar(bb, cxp, TIME * bb.speed + bb.phase) * nrows;
    const from = nrows - cyp;
    if (from > level) { out[0] = bb.r * EM_OFF; out[1] = bb.g * EM_OFF; out[2] = bb.b * EM_OFF * 1.4; return ci("░"); }
    const inten = 0.6 + 0.4 * (1 - from / Math.max(1, level));
    out[0] = bb.r * EM_BAR * inten; out[1] = bb.g * EM_BAR * inten; out[2] = bb.b * EM_BAR * inten;
    return ci(from > level - 1 ? "▓" : "█");
  }

  // outdoor: a mensagem corre pelo painel em letras de matriz 5x7
  const txt = bb.text;
  const textW = txt.length * LETTER_W;
  const shift = (TIME * bb.speed * 2.2) % (textW + w);
  const lx = ul - (w - shift);
  const li = Math.floor(lx / LETTER_W);
  const vy = (vl - (h - LETTER_H) * 0.5) / LETTER_H;
  if (li >= 0 && li < txt.length && vy >= 0 && vy < 1){
    const gl = FONT57.get(txt[li]) || FONT_BLANK;
    const fx = (lx - li * LETTER_W) / LETTER_W;
    const cxp = Math.min(4, (fx * 5) | 0), cyp = Math.min(6, (vy * 7) | 0);
    if (gl[cyp * 5 + cxp]){
      out[0] = bb.r * EM_LETTER; out[1] = bb.g * EM_LETTER; out[2] = bb.b * EM_LETTER;
      return ci("█");
    }
  }
  out[0] = bb.r * EM_OFF * 0.9; out[1] = bb.g * EM_OFF * 0.9; out[2] = bb.b * EM_OFF * 1.3;
  return ci("░");
}
const bcol = [0, 0, 0];

/* ---- luz emitida por um painel = densidade do que ele está mostrando ----
   O painel não tem um brilho fixo: a cada frame mede-se qual fração dele
   está de fato acesa — a tinta das letras que passam pela janela, a altura
   das barras do equalizador — e é isso que vira intensidade e alcance da
   luz. Uma palavra gorda como "PACHINKO" clareia a calçada mais que um
   espaço entre palavras, e o equalizador faz a fachada pulsar no ritmo.  */
function billboardDuty(bb){
  const w = bb.u1 - bb.u0, h = bb.y1 - bb.y0;
  const area = w * h;
  const innerW = Math.max(0.1, w - 0.7), innerH = Math.max(0.1, h - 0.6);
  const inner = innerW * innerH;
  // cada m² do painel contribui com o brilho que ele realmente emite
  let flux = (area - inner) * EM_FRAME * framePulse(bb);
  let litInner = 0;

  if (bb.screen){
    const nc = Math.max(1, Math.floor(innerW / 0.62));
    const t = TIME * bb.speed + bb.phase;
    let sum = 0;
    for (let c = 0; c < nc; c++) sum += screenBar(bb, c, t);
    litInner = inner * (sum / nc);
    flux += litInner * EM_BAR;
  } else {
    const txt = bb.text;
    const shift = (TIME * bb.speed * 2.2) % (txt.length * LETTER_W + w);
    const vis0 = 0.35, vis1 = w - 0.35;
    for (let li = 0; li < txt.length; li++){
      const a = (w - shift) + li * LETTER_W;
      const ov = Math.min(a + LETTER_W, vis1) - Math.max(a, vis0);
      if (ov <= 0) continue;
      litInner += (FONT_INK.get(txt[li]) || 0) * LETTER_H * ov;
    }
    if (litInner > inner) litInner = inner;
    flux += litInner * EM_LETTER;
  }
  flux += (inner - litInner) * EM_OFF;            // o fundo apagado também conta
  return clamp(flux / (area * EM_LETTER), 0, 1);
}

function updateSignLights(){
  // poste de rua acende no fim da tarde e apaga de manhã
  const lampOn = clamp(ENV.neon * 1.25 - 0.12, 0, 1);
  for (let k = 0; k < lampLights.length; k++) lampLights[k].inten = lampLights[k].baseInten * lampOn;
  for (let k = 0; k < signLights.length; k++){
    const L = signLights[k];
    const duty = billboardDuty(L.bb);
    L.bb.duty = duty;
    L.inten = L.baseInten * (0.10 + 3.2 * duty) * (0.45 + 0.55 * ENV.neon);
    L.rad   = clamp(L.baseRad * (0.55 + 0.95 * duty), 4, CFG.LIGHT_R);
  }
}

/* ---- o passe principal -------------------------------------------- */
function renderWorld(){
  const px = cam.x, pz = cam.z, eye = cam.eye;
  dirX = Math.sin(cam.yaw);  dirZ = -Math.cos(cam.yaw);
  rgtX = Math.cos(cam.yaw);  rgtZ =  Math.sin(cam.yaw);
  tanH  = Math.tan(TUNE.fov / 2);
  projH = (COLS / 2) / tanH;
  projV = projH * cellW / cellH;
  horizon = ROWS / 2 + Math.tan(cam.pitch) * projV;

  const fogR = ENV.fog[0], fogG = ENV.fog[1], fogB = ENV.fog[2];
  cellChar.fill(0);
  cellDep.fill(1e9);
  cellId.fill(0);

  for (let cx = 0; cx < COLS; cx++){
    const camX = ((cx + 0.5) / COLS) * 2 - 1;
    const rdx = dirX + rgtX * camX * tanH;
    const rdz = dirZ + rgtZ * camX * tanH;
    rdxs[cx] = rdx; rdzs[cx] = rdz;

    /* --- DDA sobre a malha de 1 m --- */
    let mapX = Math.floor(px), mapZ = Math.floor(pz);
    const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
    const ddz = rdz === 0 ? 1e30 : Math.abs(1 / rdz);
    let stepX, stepZ, sdx, sdz;
    if (rdx < 0){ stepX = -1; sdx = (px - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - px) * ddx; }
    if (rdz < 0){ stepZ = -1; sdz = (pz - mapZ) * ddz; } else { stepZ = 1; sdz = (mapZ + 1 - pz) * ddz; }

    let nHit = 0, prevH = heightAtTile(mapX, mapZ), dist = 0, side = 0;
    while (dist < CFG.FOG && nHit < MAXHIT){
      if (sdx < sdz){ dist = sdx; sdx += ddx; mapX += stepX; side = 0; }
      else          { dist = sdz; sdz += ddz; mapZ += stepZ; side = 1; }
      const h = heightAtTile(mapX, mapZ);
      if (h > prevH){
        hDist[nHit] = dist; hHigh[nHit] = h; hSide[nHit] = side;
        hMapX[nHit] = mapX; hMapZ[nHit] = mapZ;
        nHit++;
        const top = horizon - (h - eye) * projV / dist;
        if (top <= 0) break;                     // cobre o topo: nada atrás aparece
      }
      prevH = h;
    }
    zbuf[cx] = nHit ? hDist[0] : 1e9;

    /* --- piso: começa embaixo da parede mais próxima quando ela já
           cobre o horizonte, senão vem desde o horizonte --- */
    let floorFrom = Math.max(0, Math.ceil(horizon));
    if (nHit > 0){
      const d0 = hDist[0];
      const ny0 = Math.floor(horizon - (hHigh[0] - eye) * projV / d0);
      const ny1 = Math.ceil(horizon + eye * projV / d0);
      if (ny0 <= floorFrom) floorFrom = Math.max(floorFrom, ny1);
    }
    for (let y = floorFrom; y < ROWS; y++){
      const denom = y + 0.5 - horizon;
      if (denom <= 0.001) continue;
      const d = eye * projV / denom;
      const idx = y * COLS + cx;
      if (d > CFG.FOG){ cellChar[idx] = 0; continue; }
      const wx = px + rdx * d, wz = pz + rdz * d;
      groundColor(wx, wz, gcol);
      shade(wx, 0.02, wz, 0, 1, 0);
      if (ENV.wet > 0.01){                       // molhado: escuro e espelhado
        const dry = 1 - 0.45 * ENV.wet, shine = 1 + 1.6 * ENV.wet;
        gcol[0] *= dry; gcol[1] *= dry; gcol[2] *= dry;
        sR *= shine; sG *= shine; sB *= shine * 1.06;
      }
      cellDep[idx] = d;
      cellId[idx] = 1;
      const fg = 1 - Math.exp(-(d / CFG.FOG) * (d / CFG.FOG) * 2.4);
      emit(idx,
        (gcol[0] * sR) * (1 - fg) + fogR * fg,
        (gcol[1] * sG) * (1 - fg) + fogG * fg,
        (gcol[2] * sB) * (1 - fg) + fogB * fg);
    }

    /* --- paredes, do fundo para a frente --- */
    let topCovered = ROWS;
    for (let n = nHit - 1; n >= 0; n--){
      const d = hDist[n], h = hHigh[n];
      let y0 = Math.floor(horizon - (h - eye) * projV / d);
      let y1 = Math.ceil(horizon + eye * projV / d);
      if (y1 < 0 || y0 >= ROWS) continue;
      if (y0 < topCovered) topCovered = Math.max(0, y0);
      if (y0 < 0) y0 = 0;
      if (y1 > ROWS) y1 = ROWS;

      const B = blockAtTile(hMapX[n], hMapZ[n]);
      const lot = B ? B.lots[B.lotId[(hMapZ[n] - B.z0) * B.w + (hMapX[n] - B.x0)] - 1] : null;
      const faceId = lot ? (4 + ((lot.uid + hSide[n] * 7919 + (h | 0) * 31) & 0x7fff)) : 3;

      let nx = 0, nz = 0, wallU, planeC;
      if (hSide[n] === 0){
        nx = -stepX; planeC = mapXPlane(hMapX[n], stepX); wallU = pz + d * rdz;
      } else {
        nz = -stepZ; planeC = mapXPlane(hMapZ[n], stepZ); wallU = px + d * rdx;
      }
      const wx = hSide[n] === 0 ? planeC : wallU;
      const wz = hSide[n] === 0 ? wallU : planeC;

      /* outdoor que cobre esta coluna? */
      let bb = null;
      if (B){
        for (let k = 0; k < B.bbs.length; k++){
          const q = B.bbs[k];
          if (q.axis !== hSide[n]) continue;
          if (q.nrm !== (hSide[n] === 0 ? nx : nz)) continue;
          if (Math.abs(q.plane - planeC) > 0.01) continue;
          if (wallU < q.u0 || wallU > q.u1) continue;
          bb = q; break;
        }
      }

      const fog = 1 - Math.exp(-(d / CFG.FOG) * (d / CFG.FOG) * 2.4);
      for (let y = y0; y < y1; y++){
        const wy = eye + (horizon - y - 0.5) * d / projV;
        if (wy < 0) continue;
        const idx = y * COLS + cx;
        cellDep[idx] = d;
        cellId[idx] = faceId;

        if (bb && wy >= bb.y0 && wy <= bb.y1){
          const gph = billboardCell(bb, wallU, wy, bcol);
          if (gph){
            emitChar(idx, gph,
              bcol[0] * (1 - fog) + fogR * fog,
              bcol[1] * (1 - fog) + fogG * fog,
              bcol[2] * (1 - fog) + fogB * fog);
            continue;
          }
        }

        facade(wallU, wy, lot, fcol);
        shade(wx, wy, wz, nx, 0, nz);
        let r = fcol[0] * sR + fcol[3];
        let g = fcol[1] * sG + fcol[4];
        let b = fcol[2] * sB + fcol[5];
        emit(idx, r * (1 - fog) + fogR * fog, g * (1 - fog) + fogG * fog, b * (1 - fog) + fogB * fog);
      }
    }

    /* --- céu --- */
    const hinv = 1 / Math.hypot(rdx, rdz);
    skyColumn(cx, Math.min(topCovered, Math.max(0, Math.ceil(horizon))),
              Math.atan2(rdz, rdx), rdx * hinv, rdz * hinv);
  }
}
function mapXPlane(m, step){ return step > 0 ? m : m + 1; }

/* ------------------------------------------------------------------ */
/* 6b. contornos                                                       */
/* ------------------------------------------------------------------ */
/*  A v1 achava as bordas por Sobel na imagem. Aqui não existe imagem —
    existe o z-buffer da própria grade de caracteres. Então a silhueta é
    exata: onde a profundidade salta entre células vizinhas, o glifo vira
    um traço | - / \ na direção da descontinuidade. Custa uma varredura
    da grade e é o que faz a cidade "ler" em texto.                     */

let edgesOn = true;
const G_PIPE = ci("|"), G_DASH = ci("-"), G_FS = ci("/"), G_BS = ci("\\"), G_PLUS = ci("+");

function edgePass(){
  for (let y = 0; y < ROWS; y++){
    for (let x = 0; x < COLS; x++){
      const i = y * COLS + x;
      const id = cellId[i];
      if (id < 2) continue;                // céu e piso não recebem contorno
      const d = cellDep[i];
      // vizinho de outra superfície E mais longe = silhueta deste lado
      const lF = x > 0        && cellId[i - 1]    !== id && cellDep[i - 1]    > d;
      const rF = x < COLS - 1 && cellId[i + 1]    !== id && cellDep[i + 1]    > d;
      const uF = y > 0        && cellId[i - COLS] !== id && cellDep[i - COLS] > d;
      const wF = y < ROWS - 1 && cellId[i + COLS] !== id && cellDep[i + COLS] > d;
      const v = lF || rF, h = uF || wF;
      if (!v && !h) continue;
      let g;
      if (v && h){
        if ((lF && uF) || (rF && wF)) g = G_BS;
        else if ((rF && uF) || (lF && wF)) g = G_FS;
        else g = G_PLUS;
      } else g = v ? G_PIPE : G_DASH;
      cellChar[i] = g;
      // realce relativo: o contorno acompanha o brilho da célula, então
      // prédio distante não ganha uma silhueta mais forte que o da frente
      const c = cellCol[i];
      const rr = ((c >> 16) & 255) * 1.7, gg = ((c >> 8) & 255) * 1.7, bb2 = (c & 255) * 1.7;
      cellCol[i] = (rr > 255 ? 255 : rr | 0) << 16 | (gg > 255 ? 255 : gg | 0) << 8 | (bb2 > 255 ? 255 : bb2 | 0);
    }
  }
}

/* ------------------------------------------------------------------ */
/* 7. sprites (postes e árvores) com teste de profundidade por coluna  */
/* ------------------------------------------------------------------ */

function spriteProject(wx, wz){
  const dx = wx - cam.x, dz = wz - cam.z;
  const t = dx * dirX + dz * dirZ;
  if (t < 0.4 || t > CFG.FOG) return null;
  const s = dx * rgtX + dz * rgtZ;
  return { t, col: COLS / 2 + (s / t / tanH) * (COLS / 2) };
}

let spriteId = 40000;
function nextSpriteId(){ spriteId = spriteId >= 65000 ? 40000 : spriteId + 1; return spriteId; }

function drawLamp(L){
  const p = spriteProject(L.x, L.z);
  if (!p) return;
  const sid = nextSpriteId();
  const t = p.t;
  const fog = 1 - Math.exp(-(t / CFG.FOG) * (t / CFG.FOG) * 2.4);
  const yBase = horizon + cam.eye * projV / t;
  const yTop  = horizon - (L.h - cam.eye) * projV / t;
  const halfPole = Math.max(0.5, (0.085 / t / tanH) * (COLS / 2));
  const halfHead = Math.max(0.6, (0.30 / t / tanH) * (COLS / 2));
  const headTop = horizon - (L.h + 0.55 - cam.eye) * projV / t;

  // haste
  shade(L.x, L.h * 0.5, L.z, 0, 0.2, 1);
  const pr = 0.20 * sR + 0.02, pg = 0.20 * sG + 0.02, pb = 0.20 * sB + 0.03;
  const c0 = Math.max(0, Math.round(p.col - halfPole)), c1 = Math.min(COLS - 1, Math.round(p.col + halfPole));
  for (let cx = c0; cx <= c1; cx++){
    if (t >= zbuf[cx]) continue;
    const y0 = Math.max(0, Math.ceil(yTop)), y1 = Math.min(ROWS - 1, Math.floor(yBase));
    for (let y = y0; y <= y1; y++){
      cellDep[y * COLS + cx] = t; cellId[y * COLS + cx] = sid; cellId[y * COLS + cx] = sid;
      emit(y * COLS + cx, pr * (1 - fog), pg * (1 - fog), pb * (1 - fog));
    }
  }
  // luminária
  const h0 = Math.max(0, Math.ceil(headTop)), h1 = Math.min(ROWS - 1, Math.floor(yTop));
  const d0 = Math.max(0, Math.round(p.col - halfHead)), d1 = Math.min(COLS - 1, Math.round(p.col + halfHead));
  for (let cx = d0; cx <= d1; cx++){
    if (t >= zbuf[cx]) continue;
    const lampOn = clamp(ENV.neon * 1.25 - 0.12, 0, 1);
    for (let y = h0; y <= h1; y++){
      cellDep[y * COLS + cx] = t; cellId[y * COLS + cx] = sid;
      const g2 = 3.2 * (1 - fog) * (0.10 + 0.90 * lampOn);
      emit(y * COLS + cx, L.r * g2, L.g * g2, L.b * g2);
    }
  }
}

function drawTree(T){
  const p = spriteProject(T.x, T.z);
  if (!p) return;
  const t = p.t;
  if (t < 0.9) return;
  const sid = nextSpriteId();
  const fog = 1 - Math.exp(-(t / CFG.FOG) * (t / CFG.FOG) * 2.4);
  const yBase = horizon + cam.eye * projV / t;

  /* tronco */
  const trunkTop = horizon - (T.h * 0.44 - cam.eye) * projV / t;
  const halfTrunk = Math.max(0.5, (0.13 / t / tanH) * (COLS / 2));
  shade(T.x, T.h * 0.25, T.z, 0, 0.3, 1);
  const tr = 0.20 * sR, tg = 0.16 * sG, tb = 0.13 * sB;
  let c0 = Math.max(0, Math.round(p.col - halfTrunk)), c1 = Math.min(COLS - 1, Math.round(p.col + halfTrunk));
  for (let cx = c0; cx <= c1; cx++){
    if (t >= zbuf[cx]) continue;
    for (let y = Math.max(0, Math.ceil(trunkTop)); y <= Math.min(ROWS - 1, Math.floor(yBase)); y++){
      cellDep[y * COLS + cx] = t; cellId[y * COLS + cx] = sid;
      emit(y * COLS + cx, tr * (1 - fog), tg * (1 - fog), tb * (1 - fog));
    }
  }

  /* Copa. Antes era uma elipse cheia com ruído indexado em coordenada de
     TELA: de perto virava uma mancha pontilhada gigante que "nadava" quando
     a câmera andava. Agora o ruído é indexado na própria copa (fica parado),
     a silhueta é irregular e a folhagem tem furos por onde se vê a cidade. */
  const RX = 1.55, RY = 1.35;
  const cyw = T.h * 0.74;
  const halfC = (RX / t / tanH) * (COLS / 2);
  const halfR = RY * projV / t;
  const yc = horizon - (cyw - cam.eye) * projV / t;
  shade(T.x, cyw, T.z, 0, 1, 0);
  const lr = 0.34 * sR + 0.010, lg = 0.50 * sG + 0.014, lb = 0.26 * sB + 0.008;

  c0 = Math.max(0, Math.floor(p.col - halfC * 1.25));
  c1 = Math.min(COLS - 1, Math.ceil(p.col + halfC * 1.25));
  const y0 = Math.max(0, Math.floor(yc - halfR * 1.25));
  const y1 = Math.min(ROWS - 1, Math.ceil(yc + halfR * 1.25));
  for (let cx = c0; cx <= c1; cx++){
    if (t >= zbuf[cx]) continue;
    const u = (cx + 0.5 - p.col) / Math.max(0.35, halfC);
    for (let y = y0; y <= y1; y++){
      const v = (y + 0.5 - yc) / Math.max(0.35, halfR);
      const r = Math.sqrt(u * u + v * v);
      if (r > 1.3) continue;
      // silhueta recortada: o raio varia por setor angular
      const sect = Math.round(Math.atan2(v, u) * 2.7);
      if (r > 0.80 + 0.36 * hash3(sect, T.seed, 11)) continue;
      // folhagem esparsa, presa à copa (não à tela): não cintila ao andar
      const qu = Math.floor((u + 1.3) * 5.2), qv = Math.floor((v + 1.3) * 5.2);
      const d = hash3(qu, qv, T.seed);
      if (d < 0.34) continue;                       // furos entre as folhas
      const k = (0.5 + 0.7 * d) * (1 - 0.42 * r * r) * (1 - fog);
      const i = y * COLS + cx;
      cellDep[i] = t; cellId[i] = sid;
      emit(i, lr * k, lg * k, lb * k);
    }
  }
}

/** o nariz do shape, em primeira pessoa. Recebe a luz da rua como qualquer
 *  outra superfície, então passa embaixo de um poste e acende junto. */
function drawDeck(){
  if (!RIDE.on) return;
  const rows = clamp(Math.round(ROWS * 0.15), 3, 12);
  // a remada levanta o shape uma linha; nunca para baixo, senão a base sai da tela
  const bob = Math.sin(RIDE.push * Math.PI * 2) > 0.55 ? -1 : 0;
  const sid = nextSpriteId();
  shade(cam.x, 0.12, cam.z, 0, 1, 0);

  for (let r = 0; r < rows; r++){
    const t = rows === 1 ? 1 : r / (rows - 1);      // 0 = nariz (longe), 1 = pé
    const yy = Math.round(ROWS - rows + r + bob);
    if (yy < 0 || yy >= ROWS) continue;
    const half = COLS * (0.030 + 0.050 * t) * (1 - 0.40 * Math.pow(1 - t, 2.4));
    const mid  = COLS / 2 + RIDE.sway * COLS * 0.055 * (0.35 + 0.65 * t);
    const c0 = Math.max(0, Math.round(mid - half));
    const c1 = Math.min(COLS - 1, Math.round(mid + half));
    for (let cx = c0; cx <= c1; cx++){
      const idx = yy * COLS + cx;
      const rim = (cx === c0 || cx === c1) ? 2.2 : 1.0;   // borda do shape
      const a = 0.21 * rim;
      cellDep[idx] = 0.05; cellId[idx] = sid;
      emit(idx, a * sR + 0.012, a * sG + 0.012, a * sB + 0.016);
    }
  }
}

function renderSprites(){
  const bi = idxX(cam.x), bj = idxZ(cam.z);
  for (let dj = -2; dj <= 2; dj++){
    for (let di = -2; di <= 2; di++){
      const B = getBlock(bi + di, bj + dj);
      for (let k = 0; k < B.lamps.length; k++) drawLamp(B.lamps[k]);
      for (let k = 0; k < B.trees.length; k++) drawTree(B.trees[k]);
    }
  }
}

/* ------------------------------------------------------------------ */
/* 8. jogador                                                          */
/* ------------------------------------------------------------------ */

const player = { vx: 0, vz: 0, bob: 0, y: 0, vy: 0, onGround: true };
const GRAV = 22, STEP_UP = 0.45;      // degrau que se sobe andando

/* O skate é um pouco mais rápido que a corrida, mas o que muda mesmo é a
   inércia: demora a pegar, quase não freia sozinho, e a velocidade entra
   no trilho da direção do olhar em vez de trocar de rumo na hora. */
const SPEEDS = { walk: 5.4, run: 11.0, skate: 13.6 };
const RIDE = { on: false, push: 0, sway: 0 };
const keys = new Set();
let locked = false;

/** maior altura de piso sob a base do jogador (topo de laje, canteiro...) */
function topUnder(x, z, r){
  let h = heightAtTile(Math.floor(x - r), Math.floor(z - r));
  let a = heightAtTile(Math.floor(x + r), Math.floor(z - r)); if (a > h) h = a;
  a = heightAtTile(Math.floor(x - r), Math.floor(z + r)); if (a > h) h = a;
  a = heightAtTile(Math.floor(x + r), Math.floor(z + r)); if (a > h) h = a;
  return h;
}
/* Só é parede o que estiver acima dos pés mais o degrau: assim dá para subir
   num canteiro baixo andando, e pular em cima de um mais alto. */
function blockedAt(x, z, r){
  return topUnder(x, z, r) > player.y + STEP_UP || hitsLamp(x, z, r) || hitsTree(x, z, r);
}
function hitsTree(x, z, r){
  const bi = idxX(x), bj = idxZ(z);
  for (let dj = -1; dj <= 1; dj++){
    for (let di = -1; di <= 1; di++){
      const B = getBlock(bi + di, bj + dj);
      for (let k = 0; k < B.trees.length; k++){
        const T = B.trees[k];
        const dx = T.x - x, dz = T.z - z;
        if (dx * dx + dz * dz < (r + 0.22) * (r + 0.22)) return true;
      }
    }
  }
  return false;
}
function hitsLamp(x, z, r){
  const bi = idxX(x), bj = idxZ(z);
  for (let dj = -1; dj <= 1; dj++){
    for (let di = -1; di <= 1; di++){
      const B = getBlock(bi + di, bj + dj);
      for (let k = 0; k < B.lamps.length; k++){
        const L = B.lamps[k];
        const dx = L.x - x, dz = L.z - z;
        if (dx * dx + dz * dz < (r + 0.16) * (r + 0.16)) return true;
      }
    }
  }
  return false;
}

/** procura uma rua livre perto da origem para nascer */
function respawn(){
  for (let k = 0; k < 400; k++){
    const a = k * 2.399963, rad = Math.sqrt(k) * 3.2;
    const x = Math.cos(a) * rad, z = Math.sin(a) * rad;
    if (!blockedAt(x, z, 0.5)){ cam.x = x + 0.5; cam.z = z + 0.5; break; }
  }
  cam.yaw = hash3(WSEED, 5, 9) * Math.PI * 2;
  cam.pitch = 0;
  player.vx = player.vz = 0;
  player.y = topUnder(cam.x, cam.z, 0.34); player.vy = 0; player.onGround = true;
  cam.eye = player.y + CFG.EYE;
  lgKey = "";
}

function update(dt){
  const sprint = keys.has("ShiftLeft") || keys.has("ShiftRight");
  let ix = 0, iz = 0;
  if (locked){
    if (keys.has("KeyW") || keys.has("ArrowUp"))    iz += 1;
    if (keys.has("KeyS") || keys.has("ArrowDown"))  iz -= 1;
    if (keys.has("KeyD") || keys.has("ArrowRight")) ix += 1;
    if (keys.has("KeyA") || keys.has("ArrowLeft"))  ix -= 1;
  }
  const len = Math.hypot(ix, iz);
  if (len > 0){ ix /= len; iz /= len; }

  const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
  let wishX, wishZ, accel;
  if (RIDE.on){
    if (iz < 0){
      wishX = 0; wishZ = 0; accel = 4.2;      // S é freio: para, não dá ré
    } else {
      const carve = 0.45;                     // A/D fazem curva, não caranguejo
      wishX = (sy * iz + cy * ix * carve) * SPEEDS.skate;
      wishZ = (-cy * iz + sy * ix * carve) * SPEEDS.skate;
      accel = len > 0 ? 2.4 : 0.18;           // sem input o shape desliza longe
    }
  } else {
    const speed = sprint ? SPEEDS.run : SPEEDS.walk;
    wishX = (sy * iz + cy * ix) * speed;
    wishZ = (-cy * iz + sy * ix) * speed;
    accel = len > 0 ? 14 : 11;
  }
  const k = 1 - Math.exp(-accel * dt);
  player.vx += (wishX - player.vx) * k;
  player.vz += (wishZ - player.vz) * k;

  if (RIDE.on){
    // a velocidade gira junto com o olhar sem perder módulo: isso é fazer
    // curva de skate, e não patinar no gelo
    const s0 = Math.hypot(player.vx, player.vz);
    if (s0 > 0.4 && (player.vx * sy + player.vz * -cy) > 0){
      const a = 1 - Math.exp(-2.6 * dt);
      player.vx += (sy * s0 - player.vx) * a;
      player.vz += (-cy * s0 - player.vz) * a;
    }
  }

  const R = 0.34;
  const nx = cam.x + player.vx * dt;
  if (!blockedAt(nx, cam.z, R)) cam.x = nx; else player.vx = 0;
  const nz = cam.z + player.vz * dt;
  if (!blockedAt(cam.x, nz, R)) cam.z = nz; else player.vz = 0;

  /* --- vertical: pulo, gravidade e degrau --- */
  if (locked && keys.has("Space") && player.onGround){
    player.vy = RIDE.on ? 6.0 : 5.4;                 // no skate o ollie é maior
    player.onGround = false;
  }
  player.vy -= GRAV * dt;
  player.y += player.vy * dt;
  const chao = topUnder(cam.x, cam.z, R);
  if (player.y <= chao){ player.y = chao; player.vy = 0; player.onGround = true; }
  else player.onGround = false;

  const spd = Math.hypot(player.vx, player.vz);
  let head = 0;
  if (RIDE.on){
    RIDE.push += dt * (iz > 0 ? 1.5 : 0.35);         // cadência da remada
    RIDE.sway += ((locked ? ix : 0) - RIDE.sway) * (1 - Math.exp(-6 * dt));
    player.bob *= 0.9;
    head = 0.09 + (player.onGround ? Math.sin(RIDE.push * Math.PI * 2) * 0.030 : 0);
  } else {
    player.bob += dt * spd * 1.7;
    if (spd < 0.05) player.bob *= 0.9;
    RIDE.sway *= 0.9;
    head = player.onGround ? Math.sin(player.bob * 2) * 0.035 : 0;
  }
  cam.eye = player.y + CFG.EYE + head;

  rebuildLights(cam.x, cam.z);
  updateSignLights();
  updateDrops(dt);
}

/* ------------------------------------------------------------------ */
/* 9. entrada                                                          */
/* ------------------------------------------------------------------ */

let cellIdx = 2, charsetIdx = 1;
let showMinimap = true, showStats = false;
let hasPlayed = false;

/* posição do mouse já convertida para célula da grade */
let mouseGX = -1, mouseGY = -1, mouseDown = false, mouseClick = false;
let fps = 60, frameMs = 0;

function requestLock(){
  const pr = canvas.requestPointerLock({ unadjustedMovement: true });
  if (pr && typeof pr.catch === "function") pr.catch(() => { try { canvas.requestPointerLock(); } catch (e) {} });
}

document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === canvas;
  canvas.classList.toggle("playing", locked);
  if (locked) hasPlayed = true;
  else { keys.clear(); player.vx = player.vz = 0; }
});

function gridFromEvent(e){
  const r = canvas.getBoundingClientRect();
  mouseGX = Math.floor((e.clientX - r.left) / (r.width  / COLS));
  mouseGY = Math.floor((e.clientY - r.top)  / (r.height / ROWS));
}
document.addEventListener("mousemove", (e) => {
  if (locked){
    cam.yaw += e.movementX * 0.0022;
    cam.pitch = clamp(cam.pitch - e.movementY * 0.0020, -0.85, 0.85);
    if (cam.yaw >  Math.PI) cam.yaw -= Math.PI * 2;
    if (cam.yaw < -Math.PI) cam.yaw += Math.PI * 2;
  } else gridFromEvent(e);
});
canvas.addEventListener("mousedown", (e) => {
  if (locked) return;
  gridFromEvent(e);
  mouseDown = true; mouseClick = true;
  e.preventDefault();
});
window.addEventListener("mouseup", () => { mouseDown = false; });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

/* os atalhos continuam valendo — o menu é um caminho a mais, não o único */
window.addEventListener("keydown", (e) => {
  if (e.repeat){ e.preventDefault(); return; }
  keys.add(e.code);
  switch (e.code){
    case "Escape": if (locked) document.exitPointerLock?.(); break;
    case "KeyC": colorMode = !colorMode; break;
    case "KeyL": lightsOn = !lightsOn; break;
    case "KeyE": edgesOn = !edgesOn; break;
    case "KeyM": showMinimap = !showMinimap; break;
    case "KeyR": respawn(); break;
    case "KeyK": toggleSkate(); break;
    case "KeyG": newWorld(); break;
    case "KeyF": toggleFullscreen(); break;
    case "BracketLeft":  setCell(cellIdx - 1); break;
    case "BracketRight": setCell(cellIdx + 1); break;
    case "Comma":     TUNE.exposure = clamp(TUNE.exposure - 0.4, 0.6, 20); break;
    case "Period":    TUNE.exposure = clamp(TUNE.exposure + 0.4, 0.6, 20); break;
    case "Semicolon": TUNE.black = clamp(TUNE.black - 0.004, 0, 0.12); break;
    case "Quote":     TUNE.black = clamp(TUNE.black + 0.004, 0, 0.12); break;
    case "Digit1": case "Digit2": case "Digit3": case "Digit4":
      charsetIdx = clamp(parseInt(e.code.slice(5), 10) - 1, 0, CHARSETS.length - 1);
      setCharset(charsetIdx);
      break;
  }
  if (["Tab","Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", (e) => keys.delete(e.code));
window.addEventListener("blur", () => keys.clear());

/* ações compartilhadas entre o teclado e os botões do menu */
let pendingResize = false;
function setCell(i){
  const v = clamp(i, 0, CELL_SIZES.length - 1);
  if (v !== cellIdx){ cellIdx = v; pendingResize = true; }
}
function setCharsetIdx(i){
  charsetIdx = (i + CHARSETS.length) % CHARSETS.length;
  setCharset(charsetIdx);
}
function newWorld(){ WSEED = (Math.random() * 1e9) | 0; resetCity(); memoReset(); respawn(); }
function toggleFullscreen(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
function toggleSkate(){
  RIDE.on = !RIDE.on;
  if (RIDE.on) RIDE.push = 0;
  else {
    const sp = Math.hypot(player.vx, player.vz);
    if (sp > SPEEDS.run){ const f = SPEEDS.run / sp; player.vx *= f; player.vz *= f; }
  }
}

function resize(){
  [cellW, cellH] = CELL_SIZES[cellIdx];
  const cw = Math.max(320, window.innerWidth), ch = Math.max(240, window.innerHeight);
  COLS = clamp(Math.floor(cw / cellW), 40, 260);
  ROWS = clamp(Math.floor(ch / cellH), 20, 150);
  SW = COLS * cellW; SH = ROWS * cellH;

  canvas.width = SW; canvas.height = SH;
  const scale = Math.min(cw / SW, ch / SH);
  canvas.style.width  = Math.round(SW * scale) + "px";
  canvas.style.height = Math.round(SH * scale) + "px";

  cellChar = new Uint8Array(COLS * ROWS);
  cellCol  = new Uint32Array(COLS * ROWS);
  cellDep  = new Float32Array(COLS * ROWS);
  cellId   = new Uint16Array(COLS * ROWS);
  zbuf = new Float64Array(COLS);
  rdxs = new Float64Array(COLS);
  rdzs = new Float64Array(COLS);
  imgData = ctx.createImageData(SW, SH);
  imgU32 = new Uint32Array(imgData.data.buffer);
  buildGlyphs(SW);
}
window.addEventListener("resize", resize);

/* ------------------------------------------------------------------ */
/* 10. interface — desenhada na própria grade de caracteres            */
/* ------------------------------------------------------------------ */
/*  Não há uma única borda de CSS no jogo: os painéis são escritos com
    '+', '-' e '|' nas mesmas células que o raycaster acabou de pintar,
    e o mouse é testado em coordenada de célula. É uma TUI de terminal
    desenhada pelo mesmo blitter que desenha a cidade.                 */

const UI = { fg: 0x9ff5c8, dim: 0x2f6b55, hi: 0xffe066, acc: 0x66d9ff, off: 0x4a6b62,
             map0: 0x17302a, map1: 0x24483d, map2: 0x336655, map3: 0x4a8a72 };
const VALW = 20;                     // largura da coluna de valores
let panelHit = false;                // o clique caiu dentro de algum painel?

function uiCell(x, y, glyph, col){
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  const i = y * COLS + x;
  cellChar[i] = glyph; cellCol[i] = col;
}
function uiText(x, y, s, col){
  for (let k = 0; k < s.length; k++) uiCell(x + k, y, ci(s[k]), col);
}
function uiCenter(x, y, w, s, col){ uiText(x + Math.max(0, (w - s.length) >> 1), y, s, col); }
function uiClear(x, y, w, h){
  for (let j = 0; j < h; j++){
    const yy = y + j; if (yy < 0 || yy >= ROWS) continue;
    for (let i = 0; i < w; i++){
      const xx = x + i; if (xx < 0 || xx >= COLS) continue;
      cellChar[yy * COLS + xx] = 0;
    }
  }
}
/** moldura de terminal: cantos em '+', laterais em '|', topo em '-' */
function uiFrame(x, y, w, h, title){
  uiClear(x, y, w, h);
  const bar = "+" + "-".repeat(Math.max(0, w - 2)) + "+";
  uiText(x, y, bar, UI.dim);
  uiText(x, y + h - 1, bar, UI.dim);
  for (let j = 1; j < h - 1; j++){
    uiCell(x, y + j, ci("|"), UI.dim);
    uiCell(x + w - 1, y + j, ci("|"), UI.dim);
  }
  if (title) uiText(x + 3, y, "[ " + title + " ]", UI.fg);
}
function uiRule(x, y, w, label){
  uiText(x, y, "-".repeat(w), UI.dim);
  if (label) uiText(x + 1, y, " " + label + " ", UI.acc);
}
function uiIn(x, y, w, h){
  return mouseGX >= x && mouseGX < x + w && mouseGY >= y && mouseGY < y + h;
}

/** linha "rótulo ....... valor", com o cursor '>' quando o mouse está nela */
function uiRow(x, y, w, label, value, over, valCol){
  const vx = x + w - VALW;
  uiText(x, y, label, over ? UI.hi : UI.fg);
  const d0 = x + label.length + 1, dots = vx - d0 - 1;
  if (dots > 0) uiText(d0, y, ".".repeat(dots), UI.dim);
  uiText(vx, y, value, valCol);
  uiCell(x - 2, y, over ? ci(">") : 0, UI.hi);
  return vx;
}
function uiToggle(x, y, w, label, value){
  const over = uiIn(x - 2, y, w + 2, 1);
  uiRow(x, y, w, label, value ? "[ SIM ]" : "[ NAO ]", over, value ? UI.fg : UI.off);
  if (over && mouseClick){ mouseClick = false; return true; }
  return false;
}
/** devolve -1, 0 ou +1 conforme o lado clicado */
function uiCycle(x, y, w, label, valueStr){
  const over = uiIn(x - 2, y, w + 2, 1);
  const body = valueStr.length > 11 ? valueStr.slice(0, 11) : valueStr;
  const pad = 11 - body.length, l = pad >> 1;
  const vx = uiRow(x, y, w, label, "<" + " ".repeat(l) + body + " ".repeat(pad - l) + ">", over, UI.fg);
  if (over){
    const left = mouseGX < vx + 6;
    uiCell(vx, y, ci("<"), left ? UI.hi : UI.dim);
    uiCell(vx + 12, y, ci(">"), left ? UI.dim : UI.hi);
    if (mouseClick){ mouseClick = false; return left ? -1 : 1; }
  }
  return 0;
}
/** barra clicável e arrastável */
function uiSlider(x, y, w, label, v, min, max, txt){
  const BARS = 12;
  const vx = x + w - VALW;
  const over = uiIn(vx, y, BARS + 2, 1);
  const t = clamp((v - min) / (max - min), 0, 1);
  const n = Math.round(t * BARS);
  uiRow(x, y, w, label, "[" + "#".repeat(n) + "-".repeat(BARS - n) + "] " + txt,
        uiIn(x - 2, y, w + 2, 1), over ? UI.hi : UI.fg);
  if (over && mouseDown){
    const t2 = clamp((mouseGX - vx) / BARS, 0, 1);
    return min + t2 * (max - min);
  }
  return v;
}
function btnW(label){ return label.length + 4; }
function uiButton(x, y, label, primary, forceCol){
  const s = "[ " + label + " ]";
  const over = uiIn(x, y, s.length, 1);
  uiText(x, y, s, over ? UI.hi : (forceCol || (primary ? UI.fg : UI.dim)));
  if (over && mouseClick){ mouseClick = false; return true; }
  return false;
}

/* letreiro do título, montado com uma fonte 5x5 de um caractere por pixel */
const BANNER = (() => {
  const F = {
    A:[".##.","#..#","####","#..#","#..#"], S:[".###","#...",".##.","...#","###."],
    C:[".###","#...","#...","#...",".###"], I:["###",".#.",".#.",".#.","###"],
    T:["#####","..#..","..#..","..#..","..#.."], Y:["#...#",".#.#.","..#..","..#..","..#.."],
    " ":["  ","  ","  ","  ","  "]
  };
  const rows = ["", "", "", "", ""];
  for (const ch of "ASCII CITY"){
    const g = F[ch];
    for (let r = 0; r < 5; r++) rows[r] += g[r].replace(/#/g, "█").replace(/\./g, " ") + " ";
  }
  return rows;
})();

/* minimapa: amostra a própria malha do mundo, então é a cidade de verdade */
function drawMinimap(x, y, n){
  uiFrame(x, y, n + 4, n + 2, "MAPA");
  const step = 3;
  const cxp = Math.floor(cam.x), czp = Math.floor(cam.z);
  const h = n >> 1;
  const dirI = Math.round(Math.sin(cam.yaw)), dirJ = Math.round(-Math.cos(cam.yaw));
  for (let j = -h; j <= h; j++){
    for (let i = -h; i <= h; i++){
      const px2 = x + 2 + (i + h), py2 = y + 1 + (j + h);
      if (i === 0 && j === 0){ uiCell(px2, py2, ci("@"), UI.hi); continue; }
      if (i === dirI && j === dirJ){ uiCell(px2, py2, ci("^"), UI.acc); continue; }
      const ht = heightAtTile(cxp + i * step, czp + j * step);
      if (ht === 0) uiCell(px2, py2, ci("."), UI.map0);
      else if (ht < 12) uiCell(px2, py2, ci("░"), UI.map1);
      else if (ht < 30) uiCell(px2, py2, ci("▒"), UI.map2);
      else uiCell(px2, py2, ci("▓"), UI.map3);
    }
  }
  return { x, y, w: n + 4, h: n + 2 };
}

/* ---- o menu ------------------------------------------------------- */
function drawMenu(){
  panelHit = false;
  const PW = clamp(COLS - 6, 34, 58);
  const px = clamp((COLS - PW) >> 1, 0, Math.max(0, COLS - PW - (showMinimap ? 26 : 0)));
  const cx0 = px + 3, cw = PW - 6;
  const wide = ROWS >= 34, tall = ROWS >= 30;

  const items = [];
  const nop = () => {};
  if (wide){
    for (let r = 0; r < 5; r++){ const rr = r; items.push(y => uiCenter(px + 1, y, PW - 2, BANNER[rr], UI.fg)); }
    items.push(nop);
  }
  items.push(y => uiCenter(px + 1, y, PW - 2,
    hasPlayed ? "PAUSA" : "PROTOTYPE 02  -  RAYCASTER ASCII", UI.acc));
  items.push(nop);
  items.push(y => {
    const lbl = hasPlayed ? "RETOMAR" : "ENTRAR NA CIDADE";
    const bx = px + ((PW - btnW(lbl)) >> 1);
    const blink = (TIME * 1.6) % 1 < 0.55;
    if (uiButton(bx, y, lbl, true, blink ? UI.hi : UI.fg)) requestLock();
  });
  items.push(nop);

  items.push(y => uiRule(cx0 - 1, y, cw + 2, "IMAGEM"));
  items.push(y => { if (uiToggle(cx0, y, cw, "cor", colorMode)) colorMode = !colorMode; });
  items.push(y => { if (uiToggle(cx0, y, cw, "contornos", edgesOn)) edgesOn = !edgesOn; });
  items.push(y => { if (uiToggle(cx0, y, cw, "luz dinamica", lightsOn)) lightsOn = !lightsOn; });
  items.push(y => {
    const d = uiCycle(cx0, y, cw, "caractere", cellW + "x" + cellH + " px");
    if (d) setCell(cellIdx + d);
  });
  items.push(y => {
    const d = uiCycle(cx0, y, cw, "conjunto", CHARSETS[charsetIdx].name);
    if (d) setCharsetIdx(charsetIdx + d);
  });
  items.push(y => { TUNE.exposure = uiSlider(cx0, y, cw, "exposicao", TUNE.exposure, 1, 16, TUNE.exposure.toFixed(1)); });
  items.push(y => { TUNE.black    = uiSlider(cx0, y, cw, "nivel de preto", TUNE.black, 0, 0.1, TUNE.black.toFixed(3)); });
  items.push(nop);

  items.push(y => uiRule(cx0 - 1, y, cw + 2, "MUNDO"));
  items.push(y => { if (uiToggle(cx0, y, cw, "skate", RIDE.on)) toggleSkate(); });
  items.push(y => { if (uiToggle(cx0, y, cw, "minimapa", showMinimap)) showMinimap = !showMinimap; });
  items.push(y => { if (uiToggle(cx0, y, cw, "dados na tela", showStats)) showStats = !showStats; });
  items.push(y => {
    const a = "NOVO MUNDO", b = "RESPAWN", c = "TELA CHEIA";
    const total = btnW(a) + btnW(b) + btnW(c) + 4;
    let bx = px + ((PW - total) >> 1);
    if (uiButton(bx, y, a)) newWorld();               bx += btnW(a) + 2;
    if (uiButton(bx, y, b)) respawn();                bx += btnW(b) + 2;
    if (uiButton(bx, y, c)) toggleFullscreen();
  });

  if (tall){
    items.push(nop);
    items.push(y => uiRule(cx0 - 1, y, cw + 2, "CONTROLES"));
    items.push(y => uiText(cx0, y, "WASD andar  MOUSE olhar  SHIFT correr  ESPACO pular", UI.dim));
    items.push(y => uiText(cx0, y, "K pega o skate (pula tambem)", UI.dim));
    items.push(y => uiText(cx0, y, "ESC abre este menu   -   clique fora dele para voltar", UI.dim));
  }
  items.push(nop);
  items.push(y => uiText(cx0, y, statsLine(), UI.dim));

  const PH = Math.min(ROWS, items.length + 2);
  const py = clamp((ROWS - PH) >> 1, 0, Math.max(0, ROWS - PH));
  uiFrame(px, py, PW, PH, "ASCII CITY");
  for (let i = 0; i < items.length && py + 1 + i < py + PH - 1; i++) items[i](py + 1 + i);
  if (uiIn(px, py, PW, PH)) panelHit = true;

  // clique no vazio volta para o jogo
  if (mouseClick && !panelHit){ mouseClick = false; requestLock(); }
}

function relogio(){
  const h = (ENV.t * 24 + 4.3) % 24;
  return String(Math.floor(h)).padStart(2, "0") + ":" +
         String(Math.floor((h % 1) * 60)).padStart(2, "0");
}
function statsLine(){
  return "fps " + fps.toFixed(0) + "  " + frameMs.toFixed(1) + "ms  " +
         relogio() + " " + ENV.name + "  " + ENV.weather +
         "  pos " + cam.x.toFixed(0) + "," + cam.z.toFixed(0);
}

/** HUD opcional, desligado por padrão: uma linha discreta no rodapé */
function drawStats(){
  const s = statsLine() + "   " + (RIDE.on ? "SKATE " : "a pe  ") +
            (Math.hypot(player.vx, player.vz) * 3.6).toFixed(0) + " km/h";
  uiText(2, ROWS - 2, s, UI.dim);
}

function drawUI(){
  if (locked){ if (showStats) drawStats(); }
  else drawMenu();
  if (showMinimap){                                  // fica sempre na tela
    const n = clamp((Math.min(21, ROWS - 6) | 1), 9, 21);
    const r = drawMinimap(COLS - (n + 5), 1, n);
    if (!locked && uiIn(r.x, r.y, r.w, r.h)) panelHit = true;
  }
  mouseClick = false;
}

/* ------------------------------------------------------------------ */
/* 10. boot + loop                                                     */
/* ------------------------------------------------------------------ */

setCharset(charsetIdx);
initWeatherGlyphs();
updateEnv();
resize();
respawn();

let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  TIME = now / 1000;

  updateEnv();
  update(dt);
  const t0 = performance.now();
  renderWorld();
  renderSprites();
  drawDeck();
  if (edgesOn) edgePass();
  drawWeather();
  drawUI();
  blit();
  if (pendingResize){ pendingResize = false; resize(); }
  frameMs = frameMs * 0.9 + (performance.now() - t0) * 0.1;
  fps = lerp(fps, 1 / Math.max(dt, 1e-4), 0.08);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
