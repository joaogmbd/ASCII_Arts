const CAR_CORES = [[0.85,0.30,0.28],[0.30,0.55,0.90],[0.90,0.85,0.55],
                   [0.45,0.85,0.60],[0.85,0.85,0.90],[0.75,0.45,0.90]];

/* ---- densidade pelo horário ---------------------------------------- */
function horaAtual(){ return (ENV.t * 24 + 4.3) % 24; }
function densidadeRua(){
  const h = horaAtual();
  if (h >= 8  && h < 12) return 0.55;   // manhã: média
  if (h >= 12 && h < 19) return 1.00;   // tarde: cheia
  if (h >= 19)           return 0.60;   // noite: cai um pouco
  return 0.08;                          // madrugada: bem raro
}
function janelaOk(art, h){
  switch (art.janela){
    case "diurno":    return h >= 8;                 // some de madrugada
    case "noturno":   return h >= 19 || h < 8;
    case "madrugada": return h < 8;
    default:          return true;
  }
}
function sorteiaPed(h){
  const ok = PED_ART.filter(a => janelaOk(a, h));
  if (!ok.length) return PED_ART[0];
  let a = ok[(Math.random() * ok.length) | 0];
  if (a.raro && Math.random() > 0.16){               // o bêbado é exceção
    const outros = ok.filter(x => !x.raro);
    if (outros.length) a = outros[(Math.random() * outros.length) | 0];
  }
  return a;
}

/* ---- desenho de um sprite de arte ---------------------------------- */
/*  ww/wh são as medidas REAIS do corpo ou do veículo; a peça é esticada
    para caber nelas, então um carro visto de frente fica com 1,9 m de
    largura e o mesmo carro de lado com 4,4 m, usando peças diferentes. */
function drawArtSprite(wx, wz, yBase, ww, wh, art, r, g, b, flip){
  const p = spriteProject(wx, wz);
  if (!p) return;
  const t = p.t;
  const half = (ww * 0.5 / t / tanH) * (COLS / 2);
  if (half < 0.35) return;
  const yTop = rowAt(yBase + wh - cam.eye, t);
  const yBot = rowAt(yBase - cam.eye, t);
  if (yBot < 0 || yTop >= ROWS) return;
  const rows = yBot - yTop;
  if (rows < 0.6) return;

  const fog = 1 - Math.exp(-(t / TUNE.dist) * (t / TUNE.dist) * 2.4);
  const k = (1 - fog);
  const sid = nextSpriteId();
  const c0 = Math.max(0, Math.floor(p.col - half)), c1 = Math.min(COLS - 1, Math.ceil(p.col + half));
  const y0 = Math.max(0, Math.floor(yTop)), y1 = Math.min(ROWS - 1, Math.ceil(yBot));

  for (let cx = c0; cx <= c1; cx++){
    if (t >= zbuf[cx]) continue;
    let ax = Math.floor((cx + 0.5 - (p.col - half)) / (2 * half) * art.w);
    if (ax < 0 || ax >= art.w) continue;
    if (flip) ax = art.w - 1 - ax;
    for (let y = y0; y <= y1; y++){
      const ay = Math.floor((y + 0.5 - yTop) / rows * art.h);
      if (ay < 0 || ay >= art.h) continue;
      const ch = art.l[ay][ax];
      if (ch === " " || ch === undefined) continue;
      const i = y * COLS + cx;
      cellDep[i] = t; cellId[i] = sid;
      emitCharLit(i, ci(ch), r * k + 0.004, g * k + 0.004, b * k + 0.005);
    }
  }
}

/* ---- pedestres ------------------------------------------------------ */
const PED_MAX = 30;
const peds = [];
const ringOut = { x: 0, z: 0, hx: 0, hz: 0 };

/** ponto e direção sobre o anel de calçada do quarteirão */
function ringPos(B, u, out){
  const s = CFG.SIDEWALK_W / 2;
  const x0 = B.x0 + s, z0 = B.z0 + s, x1 = B.x1 - s, z1 = B.z1 - s;
  const w = x1 - x0, d = z1 - z0, P = 2 * (w + d);
  u = ((u % P) + P) % P;
  if (u < w)            { out.x = x0 + u;         out.z = z0;             out.hx = 1;  out.hz = 0; }
  else if (u < w + d)   { out.x = x1;             out.z = z0 + (u - w);   out.hx = 0;  out.hz = 1; }
  else if (u < 2*w + d) { out.x = x1 - (u-w-d);   out.z = z1;             out.hx = -1; out.hz = 0; }
  else                  { out.x = x0;             out.z = z1 - (u-2*w-d); out.hx = 0;  out.hz = -1; }
  return P;
}
function respawnPed(P){
  const bi = idxX(cam.x) + ((Math.random() * 5) | 0) - 2;
  const bj = idxZ(cam.z) + ((Math.random() * 5) | 0) - 2;
  P.B = getBlock(bi, bj);
  P.u = Math.random() * 4 * (P.B.w + P.B.d);
  P.dir = Math.random() < 0.5 ? -1 : 1;
  P.art = sorteiaPed(horaAtual());
  P.v = P.art.anda ? 0.9 + Math.random() * 0.7 : 0;
  P.lat = (Math.random() - 0.5) * (CFG.SIDEWALK_W - 1.2);
  P.fase = Math.random() * 6.28;
}
function updatePeds(dt){
  const alvo = Math.round(PED_MAX * densidadeRua());
  while (peds.length < PED_MAX) peds.push({});
  const h = horaAtual();
  for (let k = 0; k < peds.length; k++){
    const P = peds[k];
    if (k >= alvo){ P.B = null; continue; }
    if (!P.B) respawnPed(P);
    P.u += P.dir * P.v * dt;
    ringPos(P.B, P.u, ringOut);
    P.x = ringOut.x - ringOut.hz * P.lat;
    P.z = ringOut.z + ringOut.hx * P.lat;
    const dx = P.x - cam.x, dz = P.z - cam.z;
    const longe = dx*dx + dz*dz > 90 * 90;
    if (longe || (longe === false && !janelaOk(P.art, h) && dx*dx + dz*dz > 35 * 35)) respawnPed(P);
  }
}
function drawPeds(){
  for (let k = 0; k < peds.length; k++){
    const P = peds[k];
    if (!P.B) continue;
    const a = P.art;
    // balanço leve de quem caminha; o bêbado só oscila no lugar
    const sway = a.anda ? 0 : Math.sin(TIME * 1.6 + P.fase) * 0.10;
    shade(P.x, 1.0, P.z, -dirX, 0.25, -dirZ);
    const lit = 0.2126 * sR + 0.7152 * sG + 0.0722 * sB + 0.02;
    drawArtSprite(P.x + sway, P.z, 0, 0.54, 1.76, a,
                  a.cor[0] * lit, a.cor[1] * lit, a.cor[2] * lit, P.dir < 0);
  }
}

/* ---- carros --------------------------------------------------------- */
const CAR_MAX = 18;
const cars = [];
const CAR_LEN = 4.3, CAR_WID = 1.9, CAR_ALT = 1.5, LANE = 3;

function respawnCar(C, first){
  C.ax = Math.random() < 0.5 ? 0 : 1;                // 0: rua ao longo de Z
  C.idx = (C.ax === 0 ? idxX(cam.x) : idxZ(cam.z)) + ((Math.random() * 3) | 0) - 1;
  C.lane = Math.random() < 0.5 ? -1 : 1;             // mão e contramão
  const base = C.ax === 0 ? cam.z : cam.x;
  C.s = base + (Math.random() < 0.5 ? -1 : 1) * (28 + Math.random() * 45);
  if (first) C.s = base + (Math.random() - 0.5) * 120;
  C.vmax = 5.5 + Math.random() * 3.0;                // devagar, de cidade
  C.v = C.vmax;
  C.cor = CAR_CORES[(Math.random() * CAR_CORES.length) | 0];
  C.lado2 = Math.random() < 0.45;
  C.pos = { x: 0, z: 0 };
}
function carPos(C, out){
  if (C.ax === 0){ out.x = axisX(C.idx) + C.lane * LANE; out.z = C.s; }
  else           { out.z = axisZ(C.idx) + C.lane * LANE; out.x = C.s; }
}
function carFwd(C, out){
  if (C.ax === 0){ out.x = 0; out.z = C.lane; } else { out.x = C.lane; out.z = 0; }
}
const cf = { x: 0, z: 0 };

function updateCars(dt){
  const alvo = Math.round(CAR_MAX * densidadeRua());
  while (cars.length < CAR_MAX) { const C = {}; respawnCar(C, true); cars.push(C); }
  for (let k = 0; k < cars.length; k++){
    const C = cars[k];
    if (k >= alvo){ C.off = true; continue; }
    if (C.off){ C.off = false; respawnCar(C); }
    carPos(C, C.pos);
  }
  // freia por quem estiver à frente — vale tanto para fila quanto para
  // cruzamento, porque o carro que entra no cruzamento aparece na janela
  for (let k = 0; k < cars.length; k++){
    const A = cars[k];
    if (A.off) continue;
    carFwd(A, cf);
    let alvoV = A.vmax;
    for (let m = 0; m < cars.length; m++){
      if (m === k) continue;
      const Bc = cars[m];
      if (Bc.off) continue;
      const dx = Bc.pos.x - A.pos.x, dz = Bc.pos.z - A.pos.z;
      const along = dx * cf.x + dz * cf.z;
      if (along <= 0 || along > 14) continue;
      const lat = Math.abs(dx * cf.z - dz * cf.x);
      if (lat > 3.2) continue;
      const v = Math.max(0, (along - CAR_LEN - 1.2) * 1.5);
      if (v < alvoV) alvoV = v;
    }
    A.v += (alvoV - A.v) * (1 - Math.exp(-3.2 * dt));
    A.s += A.lane * A.v * dt;
    carPos(A, A.pos);
    const dx = A.pos.x - cam.x, dz = A.pos.z - cam.z;
    if (dx*dx + dz*dz > 105 * 105) respawnCar(A);
  }
}
function drawCars(){
  for (let k = 0; k < cars.length; k++){
    const C = cars[k];
    if (C.off) continue;
    carFwd(C, cf);
    const dx = cam.x - C.pos.x, dz = cam.z - C.pos.z;
    const inv = 1 / Math.max(0.001, Math.hypot(dx, dz));
    const d = (dx * cf.x + dz * cf.z) * inv;         // >0: estamos na frente
    let art, ww, flip = false;
    if (d > 0.55)       { art = CAR_ART.frente; ww = CAR_WID; }
    else if (d < -0.55) { art = CAR_ART.tras;   ww = CAR_WID; }
    else {
      art = C.lado2 ? CAR_ART.lado2 : CAR_ART.lado;
      ww = CAR_LEN;
      flip = (dx * cf.z - dz * cf.x) < 0;
    }
    shade(C.pos.x, 0.8, C.pos.z, -dirX, 0.2, -dirZ);
    const lit = 0.2126 * sR + 0.7152 * sG + 0.0722 * sB + 0.03;
    drawArtSprite(C.pos.x, C.pos.z, 0.12, ww, CAR_ALT, art,
                  C.cor[0] * lit, C.cor[1] * lit, C.cor[2] * lit, flip);
  }
}
/** o carro é sólido para o jogador */
function hitsCar(x, z, r){
  for (let k = 0; k < cars.length; k++){
    const C = cars[k];
    if (C.off) continue;
    const dx = x - C.pos.x, dz = z - C.pos.z;
    carFwd(C, cf);
    const along = Math.abs(dx * cf.x + dz * cf.z);
    const lat   = Math.abs(dx * cf.z - dz * cf.x);
    if (along < CAR_LEN * 0.5 + r && lat < CAR_WID * 0.5 + r) return true;
  }
  return false;
}

/** um único glifo posto num ponto do mundo (marcadores de porta) */
function drawGlyphMark(x, y, z, ch, r, g, b){
  const p = spriteProject(x, z);
  if (!p) return;
  const cx = Math.round(p.col);
  if (cx < 0 || cx >= COLS || p.t >= zbuf[cx]) return;
  const row = Math.round(rowAt(y - cam.eye, p.t));
  if (row < 0 || row >= ROWS) return;
  const i = row * COLS + cx;
  cellDep[i] = p.t; cellId[i] = nextSpriteId();
  emitChar(i, ci(ch), r, g, b);
  cellPin[i] = 1;                      // um glifo só: o contorno o apagaria
}

/* ---- portas: marcador, alcance e teleporte ------------------------- */
let portaPerto = null;                 // { d, subir } ou null

function acharPorta(){
  const bi = idxX(cam.x), bj = idxZ(cam.z);
  let melhor = null, md = 3.4 * 3.4;
  for (let dj = -1; dj <= 1; dj++){
    for (let di = -1; di <= 1; di++){
      const B = getBlock(bi + di, bj + dj);
      for (let k = 0; k < B.doors.length; k++){
        const d = B.doors[k];
        const naLaje = Math.abs(player.y - d.lotH) < 2.5;
        if (!naLaje && player.y > 2.5) continue;      // nem no chão nem na laje
        const x = naLaje ? d.rx : d.ox, z = naLaje ? d.rz : d.oz;
        const dx = x - cam.x, dz = z - cam.z;
        const q = dx * dx + dz * dz;
        if (q < md){ md = q; melhor = { d, subir: !naLaje }; }
      }
    }
  }
  return melhor;
}
function usarPorta(){
  if (!portaPerto) return;
  const d = portaPerto.d;
  if (portaPerto.subir){ cam.x = d.rx; cam.z = d.rz; player.y = d.lotH; }
  else { cam.x = d.ox; cam.z = d.oz; player.y = topUnder(d.ox, d.oz, 0.34); }
  player.vx = player.vz = player.vy = 0;
  player.onGround = true;
  cam.eye = player.y + CFG.EYE;
  lgKey = ""; memoReset();
}
/** exclamação em cima de cada porta e de cada saída de laje por perto */
function drawDoorMarks(){
  const bi = idxX(cam.x), bj = idxZ(cam.z);
  const bob = Math.sin(TIME * 2.4) * 0.18;
  for (let dj = -2; dj <= 2; dj++){
    for (let di = -2; di <= 2; di++){
      const B = getBlock(bi + di, bj + dj);
      for (let k = 0; k < B.doors.length; k++){
        const d = B.doors[k];
        const perto = portaPerto && portaPerto.d === d;
        const b2 = perto ? 3.4 : 1.5;
        drawGlyphMark(d.ox, 3.1 + bob, d.oz, "!", 1.0 * b2, 0.78 * b2, 0.25 * b2);
        if (Math.abs(player.y - d.lotH) < 3.5)        // só quando se está lá em cima
          drawGlyphMark(d.rx, d.lotH + 1.2 + bob, d.rz, "!", 1.0 * b2, 0.78 * b2, 0.25 * b2);
      }
    }
  }
}

/** baliza no alto da torre: pisca em vermelho, visível de longe */
function drawBeacon(bc){
  const p = spriteProject(bc.x, bc.z);
  if (!p) return;
  const on = ((TIME * 0.85 + bc.seed * 0.013) % 1) < 0.42;
  const t = p.t;
  const y = Math.round(rowAt(bc.y - cam.eye, t));
  const cx = Math.round(p.col);
  if (cx < 0 || cx >= COLS || y < 0 || y >= ROWS || t >= zbuf[cx]) return;
  const i = y * COLS + cx;
  cellDep[i] = t; cellId[i] = nextSpriteId();
  const k = on ? 3.4 : 0.25;
  emit(i, 1.0 * k, 0.22 * k, 0.18 * k);
  cellPin[i] = 1;
}

function renderSprites(){
  const bi = idxX(cam.x), bj = idxZ(cam.z);
  for (let dj = -3; dj <= 3; dj++){
    for (let di = -3; di <= 3; di++){
      const B = getBlock(bi + di, bj + dj);
      if (Math.abs(di) <= 2 && Math.abs(dj) <= 2){
        for (let k = 0; k < B.lamps.length; k++) drawLamp(B.lamps[k]);
        for (let k = 0; k < B.trees.length; k++) drawTree(B.trees[k]);
      }
      for (let k = 0; k < B.beacons.length; k++) drawBeacon(B.beacons[k]);
    }
  }
  drawCars();
  drawPeds();
  drawDoorMarks();
}

/* ------------------------------------------------------------------ */
/* 8. jogador                                                          */
/* ------------------------------------------------------------------ */

const player = { vx: 0, vz: 0, bob: 0, y: 0, vy: 0, onGround: true };
const GRAV = 22, STEP_UP = 0.45;      // degrau que se sobe andando

/* O skate é um pouco mais rápido que a corrida, mas o que muda mesmo é a
   inércia: demora a pegar, quase não freia sozinho, e a velocidade entra
   no trilho da direção do olhar em vez de trocar de rumo na hora. */
const SPEEDS = { walk: 5.4, run: 11.0, skate: 13.6 };
const RIDE = { on: false, push: 0, sway: 0 };
const keys = new Set();
let locked = false;

/** maior altura de piso sob a base do jogador (topo de laje, canteiro...) */
function topUnder(x, z, r){
  let h = heightAtTile(Math.floor(x - r), Math.floor(z - r));
  let a = heightAtTile(Math.floor(x + r), Math.floor(z - r)); if (a > h) h = a;
  a = heightAtTile(Math.floor(x - r), Math.floor(z + r)); if (a > h) h = a;
  a = heightAtTile(Math.floor(x + r), Math.floor(z + r)); if (a > h) h = a;
  return h;
}
/* Só é parede o que estiver acima dos pés mais o degrau: assim dá para subir
   num canteiro baixo andando, e pular em cima de um mais alto. */
function blockedAt(x, z, r){
  return topUnder(x, z, r) > player.y + STEP_UP ||
         hitsLamp(x, z, r) || hitsTree(x, z, r) || hitsCar(x, z, r);
}
function hitsTree(x, z, r){
  const bi = idxX(x), bj = idxZ(z);
  for (let dj = -1; dj <= 1; dj++){
    for (let di = -1; di <= 1; di++){
      const B = getBlock(bi + di, bj + dj);
      for (let k = 0; k < B.trees.length; k++){
        const T = B.trees[k];
        const dx = T.x - x, dz = T.z - z;
        if (dx * dx + dz * dz < (r + 0.22) * (r + 0.22)) return true;
      }
    }
  }
  return false;
}
function hitsLamp(x, z, r){
  const bi = idxX(x), bj = idxZ(z);
  for (let dj = -1; dj <= 1; dj++){
    for (let di = -1; di <= 1; di++){
      const B = getBlock(bi + di, bj + dj);
      for (let k = 0; k < B.lamps.length; k++){
        const L = B.lamps[k];
        const dx = L.x - x, dz = L.z - z;
        if (dx * dx + dz * dz < (r + 0.16) * (r + 0.16)) return true;
      }
    }
  }
  return false;
}

/** procura uma rua livre perto da origem para nascer */
function respawn(){
  for (let k = 0; k < 400; k++){
    const a = k * 2.399963, rad = Math.sqrt(k) * 3.2;
    const x = Math.cos(a) * rad, z = Math.sin(a) * rad;
    if (!blockedAt(x, z, 0.5)){ cam.x = x + 0.5; cam.z = z + 0.5; break; }
  }
  cam.yaw = hash3(WSEED, 5, 9) * Math.PI * 2;
  cam.pitch = 0;
  player.vx = player.vz = 0;
  player.y = topUnder(cam.x, cam.z, 0.34); player.vy = 0; player.onGround = true;
  cam.eye = player.y + CFG.EYE;
  lgKey = "";
}

function update(dt){
  updateCars(dt);
  updatePeds(dt);
  const sprint = keys.has("ShiftLeft") || keys.has("ShiftRight");
  let ix = 0, iz = 0;
  if (locked){
    if (keys.has("KeyW") || keys.has("ArrowUp"))    iz += 1;
    if (keys.has("KeyS") || keys.has("ArrowDown"))  iz -= 1;
    if (keys.has("KeyD") || keys.has("ArrowRight")) ix += 1;
    if (keys.has("KeyA") || keys.has("ArrowLeft"))  ix -= 1;
  }
  const len = Math.hypot(ix, iz);
  if (len > 0){ ix /= len; iz /= len; }

  const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
  let wishX, wishZ, accel;
  if (RIDE.on){
    if (iz < 0){
      wishX = 0; wishZ = 0; accel = 4.2;      // S é freio: para, não dá ré
    } else {
      const carve = 0.45;                     // A/D fazem curva, não caranguejo
      wishX = (sy * iz + cy * ix * carve) * SPEEDS.skate;
      wishZ = (-cy * iz + sy * ix * carve) * SPEEDS.skate;
      accel = len > 0 ? 2.4 : 0.18;           // sem input o shape desliza longe
    }
  } else {
    const speed = sprint ? SPEEDS.run : SPEEDS.walk;
    wishX = (sy * iz + cy * ix) * speed;
    wishZ = (-cy * iz + sy * ix) * speed;
    accel = len > 0 ? 14 : 11;
  }
  const k = 1 - Math.exp(-accel * dt);
  player.vx += (wishX - player.vx) * k;
  player.vz += (wishZ - player.vz) * k;

  if (RIDE.on){
    // a velocidade gira junto com o olhar sem perder módulo: isso é fazer
    // curva de skate, e não patinar no gelo
    const s0 = Math.hypot(player.vx, player.vz);
    if (s0 > 0.4 && (player.vx * sy + player.vz * -cy) > 0){
      const a = 1 - Math.exp(-2.6 * dt);
      player.vx += (sy * s0 - player.vx) * a;
      player.vz += (-cy * s0 - player.vz) * a;
    }
  }

  const R = 0.34;
  const nx = cam.x + player.vx * dt;
  if (!blockedAt(nx, cam.z, R)) cam.x = nx; else player.vx = 0;
  const nz = cam.z + player.vz * dt;
  if (!blockedAt(cam.x, nz, R)) cam.z = nz; else player.vz = 0;

  /* --- vertical: pulo, gravidade e degrau --- */
  if (locked && keys.has("Space") && player.onGround){
    player.vy = RIDE.on ? 6.0 : 5.4;                 // no skate o ollie é maior
    player.onGround = false;
  }
  player.vy -= GRAV * dt;
  player.y += player.vy * dt;
  const chao = topUnder(cam.x, cam.z, R);
  if (player.y <= chao){ player.y = chao; player.vy = 0; player.onGround = true; }
  else player.onGround = false;

  const spd = Math.hypot(player.vx, player.vz);
  let head = 0;
  if (RIDE.on){
    RIDE.push += dt * (iz > 0 ? 1.5 : 0.35);         // cadência da remada
    RIDE.sway += ((locked ? ix : 0) - RIDE.sway) * (1 - Math.exp(-6 * dt));
    player.bob *= 0.9;
    head = 0.09 + (player.onGround ? Math.sin(RIDE.push * Math.PI * 2) * 0.030 : 0);
  } else {
    player.bob += dt * spd * 1.7;
    if (spd < 0.05) player.bob *= 0.9;
    RIDE.sway *= 0.9;
    head = player.onGround ? Math.sin(player.bob * 2) * 0.035 : 0;
  }
  cam.eye = player.y + CFG.EYE + head;

  rebuildLights(cam.x, cam.z);
  updateSignLights();
  updateDrops(dt);
  portaPerto = acharPorta();
}

/* ------------------------------------------------------------------ */
/* 9. entrada                                                          */
/* ------------------------------------------------------------------ */

let cellIdx = 4, charsetIdx = 1;      // 8x14 px
let showMinimap = true, showStats = false;
let hasPlayed = false;

/* posição do mouse já convertida para célula da grade */
let mouseGX = -1, mouseGY = -1, mouseDown = false, mouseClick = false;
let fps = 60, frameMs = 0;

function requestLock(){
  const pr = canvas.requestPointerLock({ unadjustedMovement: true });
  if (pr && typeof pr.catch === "function") pr.catch(() => { try { canvas.requestPointerLock(); } catch (e) {} });
}

document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === canvas;
  canvas.classList.toggle("playing", locked);
  if (locked) hasPlayed = true;
  else { keys.clear(); player.vx = player.vz = 0; }
});

function gridFromEvent(e){
  const r = canvas.getBoundingClientRect();
  mouseGX = Math.floor((e.clientX - r.left) / (r.width  / COLS));
  mouseGY = Math.floor((e.clientY - r.top)  / (r.height / ROWS));
}
document.addEventListener("mousemove", (e) => {
  if (locked){
    cam.yaw += e.movementX * 0.0022;
    cam.pitch = clamp(cam.pitch - e.movementY * 0.0020, -PITCH_MAX, PITCH_MAX);
    if (cam.yaw >  Math.PI) cam.yaw -= Math.PI * 2;
    if (cam.yaw < -Math.PI) cam.yaw += Math.PI * 2;
  } else gridFromEvent(e);
});
canvas.addEventListener("mousedown", (e) => {
  if (locked) return;
  gridFromEvent(e);
  mouseDown = true; mouseClick = true;
  e.preventDefault();
});
window.addEventListener("mouseup", () => { mouseDown = false; });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

/* os atalhos continuam valendo — o menu é um caminho a mais, não o único */
window.addEventListener("keydown", (e) => {
  if (e.repeat){ e.preventDefault(); return; }
  keys.add(e.code);
  switch (e.code){
    case "Escape": if (locked) document.exitPointerLock?.(); break;
    case "KeyC": colorMode = !colorMode; break;
    case "KeyL": lightsOn = !lightsOn; break;
    case "KeyE": usarPorta(); break;
    case "KeyO": edgesOn = !edgesOn; break;
    case "KeyM": showMinimap = !showMinimap; break;
    case "KeyR": respawn(); break;
    case "KeyK": toggleSkate(); break;
    case "KeyG": newWorld(); break;
    case "KeyF": toggleFullscreen(); break;
    case "BracketLeft":  setCell(cellIdx - 1); break;
    case "BracketRight": setCell(cellIdx + 1); break;
    case "Comma":     TUNE.exposure = clamp(TUNE.exposure - 0.4, 0.6, 20); break;
    case "Period":    TUNE.exposure = clamp(TUNE.exposure + 0.4, 0.6, 20); break;
    case "Semicolon": TUNE.black = clamp(TUNE.black - 0.004, 0, 0.12); break;
    case "Quote":     TUNE.black = clamp(TUNE.black + 0.004, 0, 0.12); break;
    case "Digit1": case "Digit2": case "Digit3": case "Digit4":
      charsetIdx = clamp(parseInt(e.code.slice(5), 10) - 1, 0, CHARSETS.length - 1);
      setCharset(charsetIdx);
      break;
  }
  if (["Tab","Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", (e) => keys.delete(e.code));
window.addEventListener("blur", () => keys.clear());

/* ações compartilhadas entre o teclado e os botões do menu */
let pendingResize = false;
function setCell(i){
  const v = clamp(i, 0, CELL_SIZES.length - 1);
  if (v !== cellIdx){ cellIdx = v; pendingResize = true; }
}
function setCharsetIdx(i){
  charsetIdx = (i + CHARSETS.length) % CHARSETS.length;
  setCharset(charsetIdx);
}
function newWorld(){ WSEED = (Math.random() * 1e9) | 0; resetCity(); memoReset(); respawn(); }
function toggleFullscreen(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
function toggleSkate(){
  RIDE.on = !RIDE.on;
  if (RIDE.on) RIDE.push = 0;
  else {
    const sp = Math.hypot(player.vx, player.vz);
    if (sp > SPEEDS.run){ const f = SPEEDS.run / sp; player.vx *= f; player.vz *= f; }
  }
}

function resize(){
  [cellW, cellH] = CELL_SIZES[cellIdx];
  const cw = Math.max(320, window.innerWidth), ch = Math.max(240, window.innerHeight);
  COLS = clamp(Math.floor(cw / cellW), 40, 460);
  ROWS = clamp(Math.floor(ch / cellH), 20, 260);
  SW = COLS * cellW; SH = ROWS * cellH;

  canvas.width = SW; canvas.height = SH;
  const scale = Math.min(cw / SW, ch / SH);
  canvas.style.width  = Math.round(SW * scale) + "px";
  canvas.style.height = Math.round(SH * scale) + "px";

  cellChar = new Uint8Array(COLS * ROWS);
  cellCol  = new Uint32Array(COLS * ROWS);
  cellDep  = new Float32Array(COLS * ROWS);
  cellId   = new Uint16Array(COLS * ROWS);
  cellPin  = new Uint8Array(COLS * ROWS);
  rowTan = new Float64Array(ROWS);
  zbuf = new Float64Array(COLS);
  rdxs = new Float64Array(COLS);
  rdzs = new Float64Array(COLS);
  imgData = ctx.createImageData(SW, SH);
  imgU32 = new Uint32Array(imgData.data.buffer);
  buildGlyphs(SW);
}
window.addEventListener("resize", resize);

/* ------------------------------------------------------------------ */
/* 10. interface — desenhada na própria grade de caracteres            */
/* ------------------------------------------------------------------ */
/*  Não há uma única borda de CSS no jogo: os painéis são escritos com
    '+', '-' e '|' nas mesmas células que o raycaster acabou de pintar,
    e o mouse é testado em coordenada de célula. É uma TUI de terminal
    desenhada pelo mesmo blitter que desenha a cidade.                 */

const UI = { fg: 0x9ff5c8, dim: 0x2f6b55, hi: 0xffe066, acc: 0x66d9ff, off: 0x4a6b62,
             map0: 0x17302a, map1: 0x24483d, map2: 0x336655, map3: 0x4a8a72 };
const VALW = 20;                     // largura da coluna de valores
let panelHit = false;                // o clique caiu dentro de algum painel?

function uiCell(x, y, glyph, col){
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  const i = y * COLS + x;
  cellChar[i] = glyph; cellCol[i] = col;
}
function uiText(x, y, s, col){
  for (let k = 0; k < s.length; k++) uiCell(x + k, y, ci(s[k]), col);
}
function uiCenter(x, y, w, s, col){ uiText(x + Math.max(0, (w - s.length) >> 1), y, s, col); }
function uiClear(x, y, w, h){
  for (let j = 0; j < h; j++){
    const yy = y + j; if (yy < 0 || yy >= ROWS) continue;
    for (let i = 0; i < w; i++){
      const xx = x + i; if (xx < 0 || xx >= COLS) continue;
      cellChar[yy * COLS + xx] = 0;
    }
  }
}
/** moldura de terminal: cantos em '+', laterais em '|', topo em '-' */
function uiFrame(x, y, w, h, title){
  uiClear(x, y, w, h);
  const bar = "+" + "-".repeat(Math.max(0, w - 2)) + "+";
  uiText(x, y, bar, UI.dim);
  uiText(x, y + h - 1, bar, UI.dim);
  for (let j = 1; j < h - 1; j++){
    uiCell(x, y + j, ci("|"), UI.dim);
    uiCell(x + w - 1, y + j, ci("|"), UI.dim);
  }
  if (title) uiText(x + 3, y, "[ " + title + " ]", UI.fg);
}
function uiRule(x, y, w, label){
  uiText(x, y, "-".repeat(w), UI.dim);
  if (label) uiText(x + 1, y, " " + label + " ", UI.acc);
}
function uiIn(x, y, w, h){
  return mouseGX >= x && mouseGX < x + w && mouseGY >= y && mouseGY < y + h;
}

/** linha "rótulo ....... valor", com o cursor '>' quando o mouse está nela */
function uiRow(x, y, w, label, value, over, valCol){
  const vx = x + w - VALW;
  uiText(x, y, label, over ? UI.hi : UI.fg);
  const d0 = x + label.length + 1, dots = vx - d0 - 1;
  if (dots > 0) uiText(d0, y, ".".repeat(dots), UI.dim);
  uiText(vx, y, value, valCol);
  uiCell(x - 2, y, over ? ci(">") : 0, UI.hi);
  return vx;
}
function uiToggle(x, y, w, label, value){
  const over = uiIn(x - 2, y, w + 2, 1);
  uiRow(x, y, w, label, value ? "[ SIM ]" : "[ NAO ]", over, value ? UI.fg : UI.off);
  if (over && mouseClick){ mouseClick = false; return true; }
  return false;
}
/** devolve -1, 0 ou +1 conforme o lado clicado */
function uiCycle(x, y, w, label, valueStr){
  const over = uiIn(x - 2, y, w + 2, 1);
  const body = valueStr.length > 11 ? valueStr.slice(0, 11) : valueStr;
  const pad = 11 - body.length, l = pad >> 1;
  const vx = uiRow(x, y, w, label, "<" + " ".repeat(l) + body + " ".repeat(pad - l) + ">", over, UI.fg);
  if (over){
    const left = mouseGX < vx + 6;
    uiCell(vx, y, ci("<"), left ? UI.hi : UI.dim);
    uiCell(vx + 12, y, ci(">"), left ? UI.dim : UI.hi);
    if (mouseClick){ mouseClick = false; return left ? -1 : 1; }
  }
  return 0;
}
/** barra clicável e arrastável */
function uiSlider(x, y, w, label, v, min, max, txt){
  const BARS = 12;
  const vx = x + w - VALW;
  const over = uiIn(vx, y, BARS + 2, 1);
  const t = clamp((v - min) / (max - min), 0, 1);
  const n = Math.round(t * BARS);
  uiRow(x, y, w, label, "[" + "#".repeat(n) + "-".repeat(BARS - n) + "] " + txt,
        uiIn(x - 2, y, w + 2, 1), over ? UI.hi : UI.fg);
  if (over && mouseDown){
    const t2 = clamp((mouseGX - vx) / BARS, 0, 1);
    return min + t2 * (max - min);
  }
  return v;
}
function btnW(label){ return label.length + 4; }
function uiButton(x, y, label, primary, forceCol){
  const s = "[ " + label + " ]";
  const over = uiIn(x, y, s.length, 1);
  uiText(x, y, s, over ? UI.hi : (forceCol || (primary ? UI.fg : UI.dim)));
  if (over && mouseClick){ mouseClick = false; return true; }
  return false;
}

/* letreiro do título, montado com uma fonte 5x5 de um caractere por pixel */
const BANNER = (() => {
  const F = {
    A:[".##.","#..#","####","#..#","#..#"], S:[".###","#...",".##.","...#","###."],
    C:[".###","#...","#...","#...",".###"], I:["###",".#.",".#.",".#.","###"],
    T:["#####","..#..","..#..","..#..","..#.."], Y:["#...#",".#.#.","..#..","..#..","..#.."],
    " ":["  ","  ","  ","  ","  "]
  };
  const rows = ["", "", "", "", ""];
  for (const ch of "ASCII CITY"){
    const g = F[ch];
    for (let r = 0; r < 5; r++) rows[r] += g[r].replace(/#/g, "█").replace(/\./g, " ") + " ";
  }
  return rows;
})();

/* minimapa: amostra a própria malha do mundo, então é a cidade de verdade */
function drawMinimap(x, y, n){
  uiFrame(x, y, n + 4, n + 2, "MAPA");
  const step = 3;
  const cxp = Math.floor(cam.x), czp = Math.floor(cam.z);
  const h = n >> 1;
  const dirI = Math.round(Math.sin(cam.yaw)), dirJ = Math.round(-Math.cos(cam.yaw));
  for (let j = -h; j <= h; j++){
    for (let i = -h; i <= h; i++){
      const px2 = x + 2 + (i + h), py2 = y + 1 + (j + h);
      if (i === 0 && j === 0){ uiCell(px2, py2, ci("@"), UI.hi); continue; }
      if (i === dirI && j === dirJ){ uiCell(px2, py2, ci("^"), UI.acc); continue; }
      const ht = heightAtTile(cxp + i * step, czp + j * step);
      if (ht === 0) uiCell(px2, py2, ci("."), UI.map0);
      else if (ht < 12) uiCell(px2, py2, ci("░"), UI.map1);
      else if (ht < 30) uiCell(px2, py2, ci("▒"), UI.map2);
      else uiCell(px2, py2, ci("▓"), UI.map3);
    }
  }
  return { x, y, w: n + 4, h: n + 2 };
}

/* ---- o menu ------------------------------------------------------- */
function drawMenu(){
  panelHit = false;
  const PW = clamp(COLS - 6, 34, 58);
  const px = clamp((COLS - PW) >> 1, 0, Math.max(0, COLS - PW - (showMinimap ? 26 : 0)));
  const cx0 = px + 3, cw = PW - 6;
  const wide = ROWS >= 34, tall = ROWS >= 30;

  const items = [];
  const nop = () => {};
  if (wide){
    for (let r = 0; r < 5; r++){ const rr = r; items.push(y => uiCenter(px + 1, y, PW - 2, BANNER[rr], UI.fg)); }
    items.push(nop);
  }
  items.push(y => uiCenter(px + 1, y, PW - 2,
    hasPlayed ? "PAUSA" : "PROTOTYPE 02  -  RAYCASTER ASCII", UI.acc));
  items.push(nop);
  items.push(y => {
    const lbl = hasPlayed ? "RETOMAR" : "ENTRAR NA CIDADE";
    const bx = px + ((PW - btnW(lbl)) >> 1);
    const blink = (TIME * 1.6) % 1 < 0.55;
    if (uiButton(bx, y, lbl, true, blink ? UI.hi : UI.fg)) requestLock();
  });
  items.push(nop);

  items.push(y => uiRule(cx0 - 1, y, cw + 2, "IMAGEM"));
  items.push(y => { if (uiToggle(cx0, y, cw, "cor", colorMode)) colorMode = !colorMode; });
  items.push(y => { if (uiToggle(cx0, y, cw, "contornos", edgesOn)) edgesOn = !edgesOn; });
  items.push(y => { if (uiToggle(cx0, y, cw, "luz dinamica", lightsOn)) lightsOn = !lightsOn; });
  items.push(y => {
    const d = uiCycle(cx0, y, cw, "resolucao", COLS + "x" + ROWS);
    if (d) setCell(cellIdx + d);
  });
  items.push(y => {
    const d = uiCycle(cx0, y, cw, "conjunto", CHARSETS[charsetIdx].name);
    if (d) setCharsetIdx(charsetIdx + d);
  });
  items.push(y => { TUNE.exposure = uiSlider(cx0, y, cw, "exposicao", TUNE.exposure, 1, 16, TUNE.exposure.toFixed(1)); });
  items.push(y => { TUNE.black    = uiSlider(cx0, y, cw, "nivel de preto", TUNE.black, 0, 0.1, TUNE.black.toFixed(3)); });
  items.push(y => {
    const g = uiSlider(cx0, y, cw, "campo de visao", TUNE.fov * 180 / Math.PI, 0, 120,
                       (TUNE.fov * 180 / Math.PI).toFixed(0) + " g");
    TUNE.fov = clamp(g, 1, 120) * Math.PI / 180;    // 0 grau seria zoom infinito
  });
  items.push(y => {
    TUNE.dist = Math.round(uiSlider(cx0, y, cw, "alcance de visao", TUNE.dist, 60, 420,
                                    TUNE.dist.toFixed(0) + " m"));
  });
  items.push(nop);

  items.push(y => uiRule(cx0 - 1, y, cw + 2, "MUNDO"));
  items.push(y => { if (uiToggle(cx0, y, cw, "skate", RIDE.on)) toggleSkate(); });
  items.push(y => { if (uiToggle(cx0, y, cw, "minimapa", showMinimap)) showMinimap = !showMinimap; });
  items.push(y => { if (uiToggle(cx0, y, cw, "dados na tela", showStats)) showStats = !showStats; });
  items.push(y => {
    const a = "NOVO MUNDO", b = "RESPAWN", c = "TELA CHEIA";
    const total = btnW(a) + btnW(b) + btnW(c) + 4;
    let bx = px + ((PW - total) >> 1);
    if (uiButton(bx, y, a)) newWorld();               bx += btnW(a) + 2;
    if (uiButton(bx, y, b)) respawn();                bx += btnW(b) + 2;
    if (uiButton(bx, y, c)) toggleFullscreen();
  });

  if (tall){
    items.push(nop);
    items.push(y => uiRule(cx0 - 1, y, cw + 2, "CONTROLES"));
    items.push(y => uiText(cx0, y, "WASD andar  MOUSE olhar  SHIFT correr  ESPACO pular", UI.dim));
    items.push(y => uiText(cx0, y, "K pega o skate  E entra na porta  O contornos", UI.dim));
    items.push(y => uiText(cx0, y, "ESC abre este menu   -   clique fora dele para voltar", UI.dim));
  }
  items.push(nop);
  items.push(y => uiText(cx0, y, statsLine(), UI.dim));

  const PH = Math.min(ROWS, items.length + 2);
  const py = clamp((ROWS - PH) >> 1, 0, Math.max(0, ROWS - PH));
  uiFrame(px, py, PW, PH, "ASCII CITY");
  for (let i = 0; i < items.length && py + 1 + i < py + PH - 1; i++) items[i](py + 1 + i);
  if (uiIn(px, py, PW, PH)) panelHit = true;

  // clique no vazio volta para o jogo
  if (mouseClick && !panelHit){ mouseClick = false; requestLock(); }
}

function relogio(){
  const h = (ENV.t * 24 + 4.3) % 24;
  return String(Math.floor(h)).padStart(2, "0") + ":" +
         String(Math.floor((h % 1) * 60)).padStart(2, "0");
}
function statsLine(){
  return "fps " + fps.toFixed(0) + "  " + frameMs.toFixed(1) + "ms  " +
         relogio() + " " + ENV.name + "  " + ENV.weather +
         "  rua " + Math.round(densidadeRua() * 100) + "%";
}

/** HUD opcional, desligado por padrão: uma linha discreta no rodapé */
function drawStats(){
  const s = statsLine() + "   " + (RIDE.on ? "SKATE " : "a pe  ") +
            (Math.hypot(player.vx, player.vz) * 3.6).toFixed(0) + " km/h";
  uiText(2, ROWS - 2, s, UI.dim);
}

function drawUI(){
  if (locked && portaPerto){
    const txt = portaPerto.subir ? "[ E ]  SUBIR AO TOPO" : "[ E ]  DESCER";
    uiCenter(0, ROWS - 4, COLS, txt, UI.hi);
  }
  if (locked){ if (showStats) drawStats(); }
  else drawMenu();
  if (showMinimap){                                  // fica sempre na tela
    const n = clamp((Math.min(21, ROWS - 6) | 1), 9, 21);
    const r = drawMinimap(COLS - (n + 5), 1, n);
    if (!locked && uiIn(r.x, r.y, r.w, r.h)) panelHit = true;
  }
  mouseClick = false;
}

/* ------------------------------------------------------------------ */
/* 10. boot + loop                                                     */
/* ------------------------------------------------------------------ */

setCharset(charsetIdx);
initWeatherGlyphs();
updateEnv();
resize();
respawn();

let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  TIME = now / 1000;

  updateEnv();
  update(dt);
  const t0 = performance.now();
  renderWorld();
  renderSprites();
  drawDeck();
  if (edgesOn) edgePass();
  drawWeather();
  drawUI();
  blit();
  if (pendingResize){ pendingResize = false; resize(); }
  frameMs = frameMs * 0.9 + (performance.now() - t0) * 0.1;
  fps = lerp(fps, 1 / Math.max(dt, 1e-4), 0.08);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
